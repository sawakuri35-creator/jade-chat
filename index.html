<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jade Chat / 記憶システム優先</title>
  <style>
    :root{
      --bg1:#071222;
      --bg2:#071a2e;
      --panel: rgba(255,255,255,.06);
      --panel2: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --blue1: #2d64ff;
      --blue2: #1f4dd6;
      --green1:#3ecf8e;
      --shadow: rgba(0,0,0,.35);
      --radius: 18px;
      --radius2: 26px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 30% 10%, rgba(65,110,255,.18), transparent 55%),
                  radial-gradient(900px 600px at 70% 20%, rgba(62,207,142,.10), transparent 60%),
                  linear-gradient(180deg, var(--bg2), var(--bg1));
      overflow:hidden;
    }
    .wrap{
      height:100%;
      display:flex;
      flex-direction:column;
      max-width: 820px;
      margin: 0 auto;
      padding: 18px 14px 16px;
    }

    /* top header */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      padding: 10px 10px 6px;
    }
    .title{
      line-height:1.2;
      font-weight: 800;
      letter-spacing: .2px;
      font-size: 28px;
    }
    .subtitle{
      margin-top:6px;
      color: var(--muted);
      font-size: 14px;
    }

    .pillrow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top: 12px;
    }
    .pill{
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px var(--shadow);
    }
    .pill strong{color: var(--text)}
    .rightcol{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:10px;
    }
    .btn-clear{
      border:none;
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      color: var(--text);
      font-weight: 800;
      cursor:pointer;
    }
    .toggle{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 14px;
      border-radius:999px;
      background: rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.10);
      color: var(--muted);
      font-weight:800;
      user-select:none;
    }
    .switch{
      width:46px;height:26px;border-radius:999px;
      background: rgba(255,255,255,.15);
      border:1px solid rgba(255,255,255,.15);
      position:relative;
      flex:none;
      cursor:pointer;
    }
    .knob{
      width:22px;height:22px;border-radius:50%;
      background: rgba(255,255,255,.95);
      position:absolute;top:1px;left:1px;
      transition: transform .18s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,.25);
    }
    .switch.on{background: rgba(62,207,142,.25); border-color: rgba(62,207,142,.30);}
    .switch.on .knob{transform: translateX(20px);}

    /* chat area */
    .chat{
      flex:1;
      overflow:auto;
      padding: 8px 6px 0;
      scroll-behavior:smooth;
    }
    .msg{
      margin: 14px 6px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .bubble{
      max-width: 92%;
      border-radius: var(--radius2);
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid var(--stroke);
      box-shadow: 0 20px 50px var(--shadow);
      backdrop-filter: blur(10px);
      white-space: pre-wrap;
      line-height: 1.65;
      font-size: 18px;
    }
    .bubble.user{
      margin-left:auto;
      background: linear-gradient(180deg, rgba(45,100,255,.85), rgba(31,77,214,.80));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 22px 56px rgba(0,0,0,.35);
      font-weight: 800;
    }
    .bubble.system{
      margin: 10px auto 0;
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.55);
      border-style:dashed;
      font-size: 15px;
      max-width: 88%;
      text-align:center;
      padding: 12px 14px;
    }

    .debugline{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 14px;
      color: rgba(255,255,255,.70);
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.10);
      padding: 12px 14px;
      border-radius: 14px;
      max-width: 92%;
    }
    .debugline.user{margin-left:auto}
    .debugline.sys{margin-right:auto}

    /* input */
    .inputbar{
      padding: 12px 6px 0;
    }
    .inputwrap{
      display:flex;
      gap: 10px;
      align-items:flex-end;
      padding: 12px;
      border-radius: 22px;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }
    textarea{
      flex:1;
      border:none;
      outline:none;
      resize:none;
      height: 46px;
      max-height: 140px;
      padding: 12px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      color: var(--text);
      font-size: 18px;
      line-height: 1.4;
    }
    .send{
      border:none;
      background: rgba(62,207,142,.85);
      border: 1px solid rgba(255,255,255,.10);
      color: rgba(0,0,0,.80);
      font-weight: 900;
      padding: 14px 18px;
      border-radius: 16px;
      cursor:pointer;
      min-width: 92px;
      font-size: 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,.30);
    }
    .send:active{transform: translateY(1px)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="title">Jade Chat / 記憶システム優先</div>
        <div class="subtitle" id="subtitle">FREEモード（ローカル動作）</div>

        <div class="pillrow" id="pills">
          <!-- dynamic -->
        </div>
      </div>

      <div class="rightcol">
        <button class="btn-clear" id="btnClear">記憶クリア</button>

        <div class="toggle">
          debug
          <div class="switch" id="debugSwitch" role="switch" aria-checked="false" tabindex="0">
            <div class="knob"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="inputbar">
      <div class="inputwrap">
        <textarea id="input" placeholder="ラティス…？" autocomplete="off"></textarea>
        <button class="send" id="send">送信</button>
      </div>
    </div>
  </div>

<script>
(() => {
  // ====== SETTINGS ======
  const APP = {
    mode: "FREE",
    rel: "C",
    userName: "ラティス",
    assistantName: "ジェイド",
    // Topic lock: 「話題を保持するターン数」
    topicLockTurns: 4, // ここを増やすと“同じ話題で深掘り”が長く続く
    // Topic confidence: 0~1（簡易）
    topicMinConfidence: 0.35,
  };

  // ====== STORAGE KEYS ======
  const K = {
    state: "jadechat_state_v3",
    memory: "jadechat_memory_v3",
    log: "jadechat_log_v3",
  };

  // ====== DEFAULTS ======
  const defaultState = {
    turns: 0,
    topic: "",
    topicLockedUntilTurn: 0,
    topicConfidence: 0,
    debug: false,
  };

  const defaultMemory = {
    likes: [],       // ["歌うのが好き", ...]
    recents: [],     // ["最近カラオケに行った", ...]
  };

  // ====== DOM ======
  const $chat = document.getElementById("chat");
  const $input = document.getElementById("input");
  const $send = document.getElementById("send");
  const $btnClear = document.getElementById("btnClear");
  const $pills = document.getElementById("pills");
  const $debugSwitch = document.getElementById("debugSwitch");

  // ====== LOAD / SAVE ======
  function loadJSON(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return structuredClone(fallback);
      const parsed = JSON.parse(raw);
      return Object.assign(structuredClone(fallback), parsed);
    }catch(e){
      return structuredClone(fallback);
    }
  }
  function saveJSON(key, obj){
    localStorage.setItem(key, JSON.stringify(obj));
  }

  let state = loadJSON(K.state, defaultState);
  let memory = loadJSON(K.memory, defaultMemory);
  let log = loadJSON(K.log, []);

  // ====== UI HELPERS ======
  function setDebugUI(on){
    state.debug = !!on;
    saveJSON(K.state, state);
    $debugSwitch.classList.toggle("on", state.debug);
    $debugSwitch.setAttribute("aria-checked", state.debug ? "true" : "false");
  }

  function renderPills(){
    const items = [
      { label: "memory", value: String(memory.likes.length + memory.recents.length) },
      { label: "rel", value: APP.rel },
      { label: "mode", value: APP.mode },
      { label: "turns", value: String(state.turns) },
      { label: "topic", value: state.topic || "—" },
    ];
    $pills.innerHTML = items.map(x => `
      <div class="pill"><strong>${x.label}</strong> : ${escapeHtml(x.value)}</div>
    `).join("");
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  function appendBubble(role, text){
    const wrap = document.createElement("div");
    wrap.className = "msg";

    const bubble = document.createElement("div");
    bubble.className = "bubble " + (role === "user" ? "user" : role === "system" ? "system" : "assistant");
    bubble.textContent = text;

    wrap.appendChild(bubble);
    $chat.appendChild(wrap);
    $chat.scrollTop = $chat.scrollHeight;
  }

  function appendDebug(text, who="sys"){
    if(!state.debug) return;
    const wrap = document.createElement("div");
    wrap.className = "msg";
    const d = document.createElement("div");
    d.className = "debugline " + (who === "user" ? "user" : "sys");
    d.textContent = text;
    wrap.appendChild(d);
    $chat.appendChild(wrap);
    $chat.scrollTop = $chat.scrollHeight;
  }

  function persistLogEntry(role, text){
    log.push({ t: Date.now(), role, text });
    if(log.length > 300) log = log.slice(-300);
    saveJSON(K.log, log);
  }

  function rebuildChat(){
    $chat.innerHTML = "";
    // 起動メッセージ（固定）
    appendBubble("assistant", `${APP.assistantName}が静かにこちらを見ている。`);
    // ログ復元
    for(const e of log){
      appendBubble(e.role, e.text);
    }
    renderPills();
  }

  // ====== MEMORY OPS ======
  function uniqPush(arr, item, max=30){
    const norm = item.trim();
    if(!norm) return;
    const idx = arr.findIndex(x => x === norm);
    if(idx !== -1) arr.splice(idx, 1);
    arr.unshift(norm);
    if(arr.length > max) arr.length = max;
  }

  function addLike(text){
    uniqPush(memory.likes, text, 30);
    saveJSON(K.memory, memory);
  }
  function addRecent(text){
    uniqPush(memory.recents, text, 30);
    saveJSON(K.memory, memory);
  }

  function clearAll(){
    memory = structuredClone(defaultMemory);
    state.turns = 0;
    state.topic = "";
    state.topicLockedUntilTurn = 0;
    state.topicConfidence = 0;
    log = [];
    saveJSON(K.memory, memory);
    saveJSON(K.state, state);
    saveJSON(K.log, log);
    rebuildChat();
    appendBubble("system", "（記憶を消去した）");
  }

  // ====== TOPIC DETECTION ======
  function detectTopic(text){
    const t = text.trim();

    // キーワードベース（必要なら増やしてOK）
    const rules = [
      { topic: "カラオケ", keys: ["カラオケ","歌","歌う","歌った","採点","キー","マイク"] },
      { topic: "料理", keys: ["料理","作る","作った","レシピ","献立","煮込","焼い","炒め"] },
      { topic: "睡眠", keys: ["眠","ねむ","寝","起き","夜泣き","昼寝","睡眠"] },
    ];

    let best = { topic:"", score:0 };
    for(const r of rules){
      let score = 0;
      for(const k of r.keys){
        if(t.includes(k)) score += 1;
      }
      // 「最近カラオケに行った」みたいに強い表現は加点
      if(r.topic === "カラオケ" && /最近.*カラオケ/.test(t)) score += 2;

      if(score > best.score){
        best = { topic: r.topic, score };
      }
    }

    // 0~1に雑に正規化
    const confidence = Math.min(1, best.score / 4);
    return { topic: best.topic, confidence };
  }

  // Topic Lock を更新する
  function updateTopicLockFromUser(text){
    const det = detectTopic(text);

    // 今ロック中なら：強い話題転換が来ない限り保持
    const locked = state.turns < state.topicLockedUntilTurn;

    if(locked){
      // ロック中でも、別話題が強く出たら切替（信頼度高い時だけ）
      if(det.topic && det.topic !== state.topic && det.confidence >= 0.75){
        state.topic = det.topic;
        state.topicConfidence = det.confidence;
        state.topicLockedUntilTurn = state.turns + APP.topicLockTurns;
      }else{
        // ロック継続：信頼度は少しずつ減衰
        state.topicConfidence = Math.max(0, state.topicConfidence - 0.06);
      }
      return;
    }

    // ロック中でないなら：検出できた話題を採用
    if(det.topic && det.confidence >= APP.topicMinConfidence){
      state.topic = det.topic;
      state.topicConfidence = det.confidence;
      state.topicLockedUntilTurn = state.turns + APP.topicLockTurns;
    }else{
      // 何も検出できない：topicは維持するが、弱くなる
      state.topicConfidence = Math.max(0, state.topicConfidence - 0.08);
      if(state.topicConfidence <= 0.05){
        state.topic = "";
        state.topicLockedUntilTurn = 0;
      }
    }
  }

  // ====== FREE MODE RESPONSE (パターン返答) ======
  function isMemoryQuery(t){
    return /覚えてる|覚えてる\?|覚えてる？|記憶|メモ|忘れた/.test(t);
  }

  function isLikeStatement(t){
    // 「～が好き」系
    return /好き/.test(t);
  }

  function isRecentStatement(t){
    // 「最近～」系
    return /^最近/.test(t) || /この前|さっき|昨日|今日/.test(t);
  }

  function normalizeForMemory(t){
    // 余計な句読点や空白を軽く整える（強くはやらない）
    return t.replace(/\s+/g, " ").trim();
  }

  function memoryDigest(){
    const likes = memory.likes.slice(0, 5).map(x => `・${x.replace(/^・/,"")}`).join("\n");
    const recents = memory.recents.slice(0, 5).map(x => `・${x.replace(/^・/,"")}`).join("\n");

    let out = "【記憶】\n";
    if(memory.likes.length){
      out += "\n（好き）\n" + likes + "\n";
    }
    if(memory.recents.length){
      out += "\n（最近の話）\n" + recents + "\n";
    }
    if(memory.likes.length === 0 && memory.recents.length === 0){
      out += "\n（まだ記憶はありません）\n";
    }
    return out.trimEnd();
  }

  function jadePreface(){
    // ジェイドっぽい “抑制・理知的” な前置き（短め）
    const a = [
      "……承知しました。",
      "……なるほど。",
      "……理解しました。",
      "……興味深いですね。",
      "……確認ですね。",
    ];
    return a[Math.floor(Math.random()*a.length)];
  }

  function askFollowUpForTopic(topic){
    // Topic Lock中の“深掘り”質問
    switch(topic){
      case "カラオケ":
        return "……なるほど。どんな曲を歌うのが多いですか？";
      case "料理":
        return "……なるほど。最近はどんな料理を作りましたか？";
      case "睡眠":
        return "……なるほど。今いちばん困っているのは、入眠ですか、それとも夜中の覚醒ですか？";
      default:
        return "……それで、いま話したいことは何でしょう、ラティス。";
    }
  }

  function freeRespond(userText){
    const t = userText.trim();

    // 1) 記憶問い合わせ
    if(isMemoryQuery(t)){
      const pre = jadePreface();
      return `${pre}\n${memoryDigest()}\n\n他にも、覚えておいてほしい「好き」や「最近の話」があれば、一文で教えてください。`;
    }

    // 2) 記憶追加ルール：like / recent
    let didStore = false;
    let storeLines = [];

    if(isLikeStatement(t)){
      // 例：「歌うのが好き」→ likesへ
      const s = normalizeForMemory(t);
      addLike(s);
      didStore = true;
      storeLines.push("記憶に追加しました。");
    }

    if(isRecentStatement(t)){
      // 例：「最近カラオケに行った」→ recentsへ
      const s = normalizeForMemory(t);
      addRecent(s);
      didStore = true;
      // recentは“今の話は記憶しておきます”の言い回し
      storeLines.push("今の話は記憶しておきます。");
    }

    // 3) Topic Lock を更新（ユーザー発話を見て）
    updateTopicLockFromUser(t);
    saveJSON(K.state, state);

    // 4) 返答本体：ロック中なら深掘り、そうでなければ汎用
    const pre = jadePreface();

    // 「好き/最近」両方入ってたら、保存メッセージをまとめて自然に
    let mid = "";
    if(didStore){
      mid = storeLines.length === 1 ? storeLines[0] : storeLines.join("\n");
    }

    const follow = askFollowUpForTopic(state.topic);

    // “同じ質問を繰り返す”のを避けるため、直前のジェイド文と被るなら別の汎用質問に逃がす
    const lastAssistant = [...log].reverse().find(x => x.role === "assistant")?.text || "";
    let finalFollow = follow;
    if(lastAssistant.includes(follow)){
      finalFollow = "……それで、どういうところがいちばん楽しかったです？";
    }

    // 組み立て
    if(mid){
      return `${pre}\n${mid}\n\n${finalFollow}`;
    }
    return `${pre}\n\n${finalFollow}`;
  }

  // ====== SEND ======
  function send(){
    const text = $input.value.trim();
    if(!text) return;

    // ユーザー発話
    appendBubble("user", text);
    persistLogEntry("user", text);

    // turns更新（ユーザーが送った回数）
    state.turns += 1;
    saveJSON(K.state, state);

    // debug
    appendDebug(`[debug] 記憶ロードOK / rel=${APP.rel} / turns=${state.turns} / mode=${APP.mode} / topic=${state.topic || "—"} / lockUntil=${state.topicLockedUntilTurn}`, "sys");

    // FREE返答
    const reply = freeRespond(text);

    appendBubble("assistant", reply);
    persistLogEntry("assistant", reply);

    renderPills();
    $input.value = "";
    autoResize();
  }

  function autoResize(){
    $input.style.height = "46px";
    const h = Math.min(140, $input.scrollHeight);
    $input.style.height = h + "px";
  }

  // ====== EVENTS ======
  $send.addEventListener("click", send);
  $input.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      send();
    }
  });
  $input.addEventListener("input", autoResize);

  $btnClear.addEventListener("click", () => {
    if(confirm("記憶と会話ログを消去します。よろしいですか？")){
      clearAll();
    }
  });

  function toggleDebug(){
    setDebugUI(!state.debug);
    renderPills();
  }
  $debugSwitch.addEventListener("click", toggleDebug);
  $debugSwitch.addEventListener("keydown", (e) => {
    if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      toggleDebug();
    }
  });

  // ====== BOOT ======
  function boot(){
    // 初回起動の debug 表示
    setDebugUI(state.debug);

    rebuildChat();
    appendDebug(`[debug] 起動OK / memoryItems=${memory.likes.length + memory.recents.length} / rel=${APP.rel} / turns=${state.turns} / mode=${APP.mode}`, "sys");
    renderPills();
    autoResize();
  }

  boot();
})();
</script>
</body>
</html>
