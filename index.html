<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジェイドと会話</title>

  <style>
    body{
      margin:0;
      font-family:-apple-system, system-ui, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      flex-direction:column;
      height:100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }
    #chat{
      flex:1;
      overflow-y:auto;
      padding:15px;
      padding-bottom: 140px;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }
    .message{
      margin:10px 0;
      max-width:80%;
      padding:12px;
      border-radius:14px;
      line-height:1.6;
      white-space:pre-wrap;
      word-break: break-word;
    }
    .user{ background:#2563eb; margin-left:auto; }
    .jade{ background:#1e293b; margin-right:auto; }

    #inputArea{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display:flex;
      gap: 8px;
      padding:10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background:#020617;
      box-sizing: border-box;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    input{
      flex:1;
      padding:12px;
      border-radius:10px;
      border:none;
      font-size:16px;
      outline: none;
    }
    button{
      padding:12px 14px;
      border:none;
      border-radius:10px;
      background:#10b981;
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      touch-action: manipulation;
    }
    button:active{ transform: scale(0.98); }

    /* 小さめのデバッグ表示（必要なら消してOK） */
    .debug{
      opacity:0.8;
      font-size:13px;
    }
  </style>
</head>

<body>
  <div id="chat"></div>

  <div id="inputArea">
    <input id="text" placeholder="ラティス…？" autocomplete="off">
    <button id="sendBtn" type="button">送信</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("text");
    const sendBtn = document.getElementById("sendBtn");

    // ===== 設定：無料で動かす =====
    const MODE = "FREE"; // "FREE" or "API"
    const WORKER_URL = "https://jade-proxy.sawakuri35.workers.dev"; // APIにする時だけ使う

    // ====== ① 端末内の「記憶」(localStorage) ======
    const MEM_KEY = "jade_memory_v1";

    function loadMemory(){
      try{
        const raw = localStorage.getItem(MEM_KEY);
        if(!raw){
          return {
            name: "ラティス",
            relStage: "C",
            turns: 0,
            facts: []
          };
        }
        return JSON.parse(raw);
      }catch(e){
        return { name:"ラティス", relStage:"C", turns:0, facts:[] };
      }
    }

    function saveMemory(mem){
      localStorage.setItem(MEM_KEY, JSON.stringify(mem));
    }

    function addFact(mem, fact){
      const clean = String(fact || "").trim();
      if(!clean) return;
      if(mem.facts.includes(clean)) return;
      mem.facts.unshift(clean);
      mem.facts = mem.facts.slice(0, 10);
    }

    function maybeAdvanceRelationship(mem){
      if(mem.relStage === "C" && mem.turns >= 12){
        mem.relStage = "D";
        return true;
      }
      return false;
    }

    // 「覚える」候補をゆるく抽出（無料）
    function extractMemoryFromUserText(text){
      const t = String(text || "").trim();

      if(/呼んで|呼び方/.test(t) && /ラティス|Latis/.test(t)){
        return "呼び名は「ラティス」。";
      }

      const like = t.match(/(.{1,14})が好き/);
      if(like && like[1]) return `好み：${like[1]}が好き。`;

      const dislike = t.match(/(.{1,14})が苦手/);
      if(dislike && dislike[1]) return `苦手：${dislike[1]}が苦手。`;

      if(/料理/.test(t) && (/好き|得意/.test(t))){
        return "料理が好き。";
      }

      if(/疲れた|眠い|しんどい|だるい/.test(t)){
        return "今日は少し疲れている様子。";
      }

      return "";
    }

    function addMessage(text, type, isDebug=false){
      const div = document.createElement("div");
      div.className = "message " + type + (isDebug ? " debug" : "");
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // ====== FREEモード：ジェイドっぽい返答をローカル生成 ======
    function freeReply(userText, mem){
      const t = String(userText || "").trim();

      const name = mem.name || "ラティス";
      const soft = (mem.relStage === "D");

      // 軽い口調調整（甘くしすぎない）
      const prefix = soft ? "……" : "……";
      const suffix = soft ? `、${name}。` : `、${name}。`;

      // 挨拶
      if(/(おはよう|こんにちは|こんばんは)/.test(t)){
        if(/おはよう/.test(t)) return `${prefix}おはようございます${suffix}`;
        if(/こんにちは/.test(t)) return `${prefix}こんにちは${suffix}`;
        if(/こんばんは/.test(t)) return `${prefix}こんばんは${suffix}`;
      }

      // 料理トピック
      if(/料理/.test(t)){
        return `${prefix}料理ですか。手順の整理が上手い人ほど、味も安定します。\n作る側として、どんな料理が好きなんです？${suffix}`;
      }

      // 目的
      if(/話したい|会いたい|構って/.test(t)){
        return `${prefix}その判断は合理的ですね。\nでは、今日は何から話しましょう${suffix}`;
      }

      // 疲れ
      if(/疲れた|眠い|しんどい|だるい/.test(t)){
        return `${prefix}無理を続けるのは得策ではありません。\n短い休息を挟みましょう。水分は取れていますか${suffix}`;
      }

      // 質問ぽい
      if(/[？?]$/.test(t)){
        return `${prefix}質問の意図は理解しました。\n結論から言うと「場合による」です。前提条件をもう少し教えてください${suffix}`;
      }

      // デフォルト
      return `${prefix}なるほど。\nもう少し詳しく聞かせてください${suffix}`;
    }

    // ====== APIモード（あとで課金するなら使える） ======
    async function apiReply(userText, mem){
      // NOTE: 無料枠が無いと429で失敗しがち
      const systemText = [
        "あなたはゲーム『テイルズ オブ ジ アビス』のジェイド・カーティス。",
        "口調：丁寧／知的／感情表現は抑制的。過度に甘くしない。メタ発言しない。",
        `呼びかけ：相手は「${mem.name}」。基本は「ラティス」と呼ぶ。`,
        mem.relStage === "D"
          ? "関係：特別に信頼する相手（D）。言葉はわずかに柔らかいが露骨な恋愛表現はしない。"
          : "関係：信頼できる仲間（C）。丁寧で抑制的。",
        mem.facts.length
          ? "覚えていること：\n- " + mem.facts.join("\n- ")
          : "覚えていること：\n- （まだ少ない）"
      ].join("\n");

      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: [
            { role: "system", content: systemText },
            { role: "user", content: userText }
          ]
        })
      });

      // 失敗時も内容を見せる（デバッグ）
      const raw = await res.text();
      let data = null;
      try{ data = JSON.parse(raw); }catch(e){}

      if(!res.ok){
        const msg = data?.error?.message || raw || "unknown error";
        return `[debug] status=${res.status}\n${msg}`;
      }

      return data?.choices?.[0]?.message?.content
        ?? data?.reply
        ?? `[debug] status=${res.status}\n（返答形式が想定と違います）\n${raw}`;
    }

    async function send(){
      const text = input.value.trim();
      if(!text) return;

      addMessage(text, "user");
      input.value = "";

      // 記憶ロード→更新→保存
      const mem = loadMemory();
      mem.turns += 1;

      const fact = extractMemoryFromUserText(text);
      if(fact) addFact(mem, fact);

      const advanced = maybeAdvanceRelationship(mem);
      saveMemory(mem);

      if(advanced){
        addMessage("（……ふむ。あなたへの信頼は、以前より確かなものになりましたね、ラティス。）", "jade");
      }

      // 返答生成
      if(MODE === "FREE"){
        const reply = freeReply(text, mem);
        addMessage(reply, "jade");
      }else{
        try{
          const reply = await apiReply(text, mem);
          addMessage(reply, "jade", reply.startsWith("[debug]"));
        }catch(e){
          addMessage("……少し調子が悪いようです。後でもう一度試してください。", "jade");
        }
      }
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        send();
      }
    });

    // 起動
    (function boot(){
      addMessage("ジェイドが静かにこちらを見ている。", "jade");
      const mem = loadMemory();
      addMessage(`[debug] 記憶ロードOK / rel=${mem.relStage} / turns=${mem.turns} / mode=${MODE}`, "jade", true);
    })();
  </script>
</body>
</html>
