<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jade Chat / 記憶システム優先</title>
  <style>
    :root{
      --bg1:#070b16;
      --bg2:#0b1630;
      --card:rgba(255,255,255,.07);
      --card2:rgba(255,255,255,.09);
      --stroke:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --muted2:rgba(255,255,255,.52);
      --blue:#3c6cff;
      --blue2:#2f5fff;
      --green:#2ee59d;
      --shadow:0 20px 70px rgba(0,0,0,.45);
      --r:22px;
      --r2:18px;
      --pad:16px;
      --pad2:12px;
      --font:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    html,body{height:100%;}
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background: radial-gradient(1200px 900px at 30% 0%, rgba(60,108,255,.18), transparent 60%),
                  radial-gradient(900px 700px at 80% 20%, rgba(46,229,157,.10), transparent 60%),
                  linear-gradient(180deg, var(--bg2), var(--bg1));
      overflow-x:hidden;
    }
    .wrap{
      max-width:820px;
      margin:0 auto;
      padding:22px 14px 120px;
    }
    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-top:4px;
      margin-bottom:14px;
    }
    .title{
      line-height:1.12;
    }
    .title h1{
      font-size:26px;
      margin:0;
      letter-spacing:.2px;
    }
    .title .sub{
      margin-top:6px;
      font-size:14px;
      color:var(--muted2);
    }
    .controls{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
      min-width:140px;
    }
    .chipRow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin:14px 0 18px;
    }
    .chip{
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);
      color:var(--muted);
      font-size:14px;
      letter-spacing:.2px;
      backdrop-filter: blur(8px);
    }
    .chip strong{ color:var(--text); font-weight:600; }
    .btn{
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.07);
      color:var(--text);
      padding:12px 14px;
      border-radius:999px;
      font-size:14px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{ transform: translateY(1px); }
    .btnDanger{
      background:rgba(255,80,80,.12);
      border-color:rgba(255,80,80,.25);
    }
    .toggle{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);
    }
    .toggle span{ color:var(--muted); font-size:14px; }
    .switch{
      width:54px; height:30px;
      border-radius:999px;
      background:rgba(255,255,255,.12);
      position:relative;
      border:1px solid rgba(255,255,255,.12);
      cursor:pointer;
      flex:0 0 auto;
    }
    .knob{
      position:absolute;
      top:3px; left:3px;
      width:24px; height:24px;
      border-radius:50%;
      background:rgba(255,255,255,.90);
      transition:.16s ease;
    }
    .switch.on{ background:rgba(46,229,157,.20); border-color:rgba(46,229,157,.30); }
    .switch.on .knob{ left:27px; background:rgba(255,255,255,.95); }
    .timeline{
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .bubble{
      border:1px solid var(--stroke);
      background:var(--card);
      border-radius:var(--r);
      padding:16px 18px;
      box-shadow: var(--shadow);
      white-space:pre-wrap;
      line-height:1.7;
      font-size:17px;
    }
    .bubble.user{
      align-self:flex-end;
      background: linear-gradient(180deg, rgba(60,108,255,.86), rgba(47,95,255,.86));
      border-color: rgba(255,255,255,.18);
      color:white;
      max-width:86%;
    }
    .bubble.ai{
      align-self:flex-start;
      max-width:88%;
    }
    .bubble.sys{
      align-self:flex-start;
      max-width:92%;
      background:rgba(255,255,255,.05);
      border-style:dashed;
      color:var(--muted);
      font-size:14px;
      box-shadow:none;
    }

    .composer{
      position:fixed;
      left:0; right:0; bottom:0;
      padding:14px 14px calc(14px + env(safe-area-inset-bottom));
      backdrop-filter: blur(12px);
      background: linear-gradient(180deg, rgba(7,11,22,0), rgba(7,11,22,.84));
      border-top:1px solid rgba(255,255,255,.08);
    }
    .composerInner{
      max-width:820px;
      margin:0 auto;
      display:flex;
      gap:12px;
      align-items:center;
    }
    input[type="text"]{
      flex:1;
      font-size:17px;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.25);
      color:var(--text);
      outline:none;
    }
    input::placeholder{ color:rgba(255,255,255,.40); }
    .send{
      min-width:92px;
      font-size:18px;
      padding:14px 18px;
      border-radius:16px;
      border:0;
      background:rgba(46,229,157,.85);
      color:#062015;
      font-weight:700;
      cursor:pointer;
    }
    .send:active{ transform: translateY(1px); }
    .small{
      color:var(--muted2);
      font-size:12px;
      margin-top:6px;
      text-align:right;
    }

    @media (max-width:520px){
      .title h1{ font-size:22px; }
      .bubble{ font-size:16px; }
      .controls{ min-width:auto; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>Jade Chat / 記憶システム優先</h1>
        <div class="sub">FREEモード（ローカル動作）</div>
      </div>
      <div class="controls">
        <button class="btn btnDanger" id="btnClear">記憶クリア</button>
        <div class="toggle">
          <span>debug</span>
          <div class="switch" id="debugSwitch" role="switch" aria-checked="false">
            <div class="knob"></div>
          </div>
        </div>
      </div>
    </header>

    <div class="chipRow" id="chips"></div>

    <div class="timeline" id="timeline"></div>
  </div>

  <div class="composer">
    <div class="composerInner">
      <input id="input" type="text" placeholder="ラティス…？" autocomplete="off" />
      <button id="send" class="send">送信</button>
    </div>
    <div class="composerInner small" id="hint"></div>
  </div>

<script>
/* =========================
   Jade Chat (FREE / Local)
   - Memory System Priority
   - Prevent repeating same question patterns
   ========================= */

const LS_KEY = "jade_chat_state_v3";

const DEFAULT_STATE = {
  mode: "FREE",
  rel: "C",
  turns: 0,
  debug: false,
  topic: "",
  memory: {
    likes: [],   // e.g. "歌うのが好き"
    recent: []   // e.g. "最近カラオケに行った"
  },
  // 「同じ質問を繰り返さない」ための履歴
  lastQuestionKeyByTopic: {}, // { "カラオケ": "karaoke_q1", "default": "..." }
  lastAIText: "",
  lastUserText: ""
};

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return structuredClone(DEFAULT_STATE);
    const s = JSON.parse(raw);
    // safety merge
    return {
      ...structuredClone(DEFAULT_STATE),
      ...s,
      memory: {
        ...structuredClone(DEFAULT_STATE.memory),
        ...(s.memory || {})
      },
      lastQuestionKeyByTopic: s.lastQuestionKeyByTopic || {}
    };
  }catch(e){
    return structuredClone(DEFAULT_STATE);
  }
}
function saveState(){
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

let state = loadState();

/* ---------- UI helpers ---------- */
const $timeline = document.getElementById("timeline");
const $chips = document.getElementById("chips");
const $input = document.getElementById("input");
const $send = document.getElementById("send");
const $btnClear = document.getElementById("btnClear");
const $debugSwitch = document.getElementById("debugSwitch");
const $hint = document.getElementById("hint");

function addBubble(role, text){
  const div = document.createElement("div");
  div.className = `bubble ${role}`;
  div.textContent = text;
  $timeline.appendChild(div);
  div.scrollIntoView({behavior:"smooth", block:"end"});
}

function addSys(text){
  if(!state.debug) return;
  addBubble("sys", text);
}

function setDebug(on){
  state.debug = !!on;
  $debugSwitch.classList.toggle("on", state.debug);
  $debugSwitch.setAttribute("aria-checked", String(state.debug));
  saveState();
  renderChips();
}

function renderChips(){
  const memoryCount = (state.memory.likes?.length || 0) + (state.memory.recent?.length || 0);
  const chips = [
    `memory : <strong>${memoryCount}</strong>`,
    `rel : <strong>${escapeHtml(state.rel)}</strong>`,
    `mode : <strong>${escapeHtml(state.mode)}</strong>`,
    `turns : <strong>${state.turns}</strong>`,
    state.topic ? `topic : <strong>${escapeHtml(state.topic)}</strong>` : null
  ].filter(Boolean);

  $chips.innerHTML = "";
  chips.forEach(html=>{
    const c = document.createElement("div");
    c.className = "chip";
    c.innerHTML = html;
    $chips.appendChild(c);
  });

  $hint.textContent = state.debug
    ? "debug: ON（内部ログが表示されます）"
    : "";
}

function escapeHtml(s){
  return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

/* ---------- Topic extraction ---------- */
function extractTopic(text){
  const t = text.trim();
  if(!t) return "";

  const rules = [
    { topic:"カラオケ", keys:["カラオケ","歌","歌う","唄","DAM","JOYSOUND"] },
    { topic:"料理", keys:["料理","作る","レシピ","煮る","焼く","炒め","オムライス","デミ","味噌"] },
    { topic:"睡眠", keys:["寝","睡眠","起き","夜泣","ねんね","リズム"] },
    { topic:"仕事", keys:["仕事","職場","勤務","夜勤","看護","SE"] }
  ];

  for(const r of rules){
    if(r.keys.some(k=>t.includes(k))) return r.topic;
  }
  return state.topic || ""; // 変化がなければ維持
}

/* ---------- Memory extraction ---------- */
function normalize(text){
  return text.replace(/\s+/g," ").trim();
}

function addToUnique(arr, item, limit=20){
  item = normalize(item);
  if(!item) return;
  if(arr.includes(item)) return;
  arr.unshift(item);
  if(arr.length > limit) arr.length = limit;
}

function maybeStoreMemory(userText){
  const t = normalize(userText);

  // 好き
  // 例: 「歌うのが好き」「料理するのも好き」「○○が好き」
  if(/(が|も)\s*好き/.test(t) || /好き$/.test(t)){
    // 長すぎる文は切る（暴走防止）
    const clipped = t.length > 70 ? t.slice(0,70) + "…" : t;
    addToUnique(state.memory.likes, clipped, 30);
    return { stored: true, kind: "likes", value: clipped };
  }

  // 最近の話
  if(t.startsWith("最近") || t.includes("最近")){
    const clipped = t.length > 80 ? t.slice(0,80) + "…" : t;
    addToUnique(state.memory.recent, clipped, 30);
    return { stored: true, kind: "recent", value: clipped };
  }

  return { stored: false };
}

/* ---------- FREE response engine ---------- */

function isAskMemory(text){
  const t = normalize(text);
  return (
    t.includes("覚えてる") ||
    t.includes("覚えてる？") ||
    t.includes("覚えてる?") ||
    t.includes("記憶") ||
    t.includes("覚えてるかな")
  );
}

function buildMemorySummary(){
  const likes = state.memory.likes || [];
  const recent = state.memory.recent || [];
  let out = "……確認ですね。\n\n【記憶】\n";
  if(likes.length){
    out += "\n（好き）\n";
    likes.slice(0,8).forEach(x=> out += `・${x}\n`);
  }
  if(recent.length){
    out += "\n（最近の話）\n";
    recent.slice(0,8).forEach(x=> out += `・${x}\n`);
  }
  if(!likes.length && !recent.length){
    out += "（まだ何も登録されていません）\n";
  }
  out += "\n他にも、覚えておいてほしい「好き」や「最近の話」があれば、一文で教えてください。";
  return out;
}

// topicごとに質問セットを用意（同じのを繰り返さない）
const QUESTION_BANK = {
  "カラオケ": [
    { key:"karaoke_q1", text:"……なるほど。どんな曲を歌うのが多いですか？" },
    { key:"karaoke_q2", text:"……最近いちばん気持ちよく歌えた曲は何です？" },
    { key:"karaoke_q3", text:"……高音寄りと低音寄り、どちらが歌いやすいですか？" },
    { key:"karaoke_q4", text:"……ひとりで行く派ですか、それとも誰かと？" },
  ],
  "料理": [
    { key:"cook_q1", text:"……なるほど。得意料理は何です？" },
    { key:"cook_q2", text:"……味付けは、和風と洋風どちらが多いです？" },
    { key:"cook_q3", text:"……作るときは、手早さ重視ですか？それとも工程を楽しむタイプ？" },
  ],
  "睡眠": [
    { key:"sleep_q1", text:"……なるほど。いちばん困っているのは、寝つきですか？夜中の覚醒ですか？" },
    { key:"sleep_q2", text:"……入眠前の流れ（お風呂→授乳→絵本…など）を、だいたいで教えてください。" },
  ],
  "仕事": [
    { key:"work_q1", text:"……なるほど。今の仕事で、いちばん神経を使うのはどの場面です？" },
    { key:"work_q2", text:"……職場の雰囲気は、忙しさより人間関係のほうが影響しますか？" },
  ],
  "default": [
    { key:"def_q1", text:"……なるほど。今いちばん話したいのは、どの話題です？" },
    { key:"def_q2", text:"……差し支えなければ、今日いちばん気に掛かったことを一つ。" },
    { key:"def_q3", text:"……今の気分は、落ち着きたい感じですか？それとも気分転換？" },
  ]
};

function nextQuestionForTopic(topic){
  const bank = QUESTION_BANK[topic] || QUESTION_BANK["default"];
  const lastKey = state.lastQuestionKeyByTopic[topic || "default"] || null;

  // lastKey の次を選ぶ（なければ先頭）
  let idx = 0;
  if(lastKey){
    const found = bank.findIndex(x=>x.key === lastKey);
    if(found >= 0) idx = (found + 1) % bank.length;
  }
  const chosen = bank[idx];

  // 記録
  state.lastQuestionKeyByTopic[topic || "default"] = chosen.key;

  return chosen.text;
}

// FREEモードの「ジェイドっぽい」前置きを安定させる
function jadePrefix(){
  return "……そういえば、ラティスは";
}

function generateFreeReply(userText, memInfo){
  // まずは記憶質問
  if(isAskMemory(userText)){
    return buildMemorySummary();
  }

  // topic更新
  const newTopic = extractTopic(userText);
  state.topic = newTopic || state.topic || "";

  // 記憶追加があった場合の文言（短め）
  let memLine = "";
  if(memInfo?.stored){
    memLine = "記憶に追加しました。\n\n";
  }

  // 「好き」「最近」などを言った直後は、
  // 会話を前に進める質問を topic に合わせて出す（繰り返し防止）
  const t = state.topic || "default";
  const q = nextQuestionForTopic(t);

  // ここで「同じ質問の連打」をさらに防ぐ保険（文字列一致）
  if(state.lastAIText && state.lastAIText.includes(q)){
    // もう一個先に回す
    const q2 = nextQuestionForTopic(t);
    return `${jadePrefix()}「${shrinkForQuote(userText)}」が${inferLikeWord(userText)}。\n${memLine}${q2}`;
  }

  return `${jadePrefix()}「${shrinkForQuote(userText)}」が${inferLikeWord(userText)}。\n${memLine}${q}`;
}

function shrinkForQuote(s){
  s = normalize(s);
  if(s.length > 22) return s.slice(0,22) + "…";
  return s;
}
function inferLikeWord(userText){
  const t = normalize(userText);
  if(t.includes("好き")) return "好き。";
  if(t.includes("最近")) return "最近の話ですね。";
  // 汎用
  return "話題に上がりましたね。";
}

/* ---------- Boot ---------- */

function boot(){
  renderChips();

  // 起動メッセージ
  addBubble("ai", "ジェイドが静かにこちらを見ている。");
  addSys(`[debug] 起動OK / memoryItems=${(state.memory.likes.length + state.memory.recent.length)} / rel=${state.rel} / turns=${state.turns} / mode=${state.mode}`);

  // debug switch init
  setDebug(state.debug);

  // events
  $send.addEventListener("click", onSend);
  $input.addEventListener("keydown", (e)=>{
    if(e.key === "Enter") onSend();
  });

  $btnClear.addEventListener("click", ()=>{
    if(!confirm("記憶をすべて消去します。よろしいですか？")) return;
    state.memory.likes = [];
    state.memory.recent = [];
    state.turns = 0;
    state.topic = "";
    state.lastQuestionKeyByTopic = {};
    saveState();
    renderChips();
    addBubble("sys","（記憶を消去した）");
    addSys("[debug] 記憶クリアOK");
  });

  $debugSwitch.addEventListener("click", ()=>{
    setDebug(!state.debug);
  });
}

function onSend(){
  const text = $input.value.trim();
  if(!text) return;
  $input.value = "";

  // user bubble
  addBubble("user", text);

  // update turns
  state.turns += 1;
  state.lastUserText = text;

  // store memory (if matches)
  const memInfo = maybeStoreMemory(text);

  // debug memory load info
  addSys(`[debug] 記憶ロードOK / rel=${state.rel} / turns=${state.turns} / mode=${state.mode}`);

  // FREE reply
  const reply = generateFreeReply(text, memInfo);

  state.lastAIText = reply;

  saveState();
  renderChips();
  addBubble("ai", reply);
}

boot();
</script>
</body>
</html>
