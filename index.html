<script>

/* =========================
   意味リンク
========================= */

const SEMANTIC_LINKS = {
  "歌う": ["歌","歌う","カラオケ","音楽","曲","歌った","歌って"],
  "料理": ["料理","自炊","レシピ","作る","ご飯"]
};


/* =========================
   記憶検索
========================= */

function recallFromText(userText){

  const text = userText.toLowerCase();

  for(const item of state.memoryItems){

    if(item.type !== "like") continue;

    const links = SEMANTIC_LINKS[item.value] || [];

    for(const key of links){
      if(text.includes(key)){
        return item;
      }
    }

    if(text.includes(item.value)){
      return item;
    }
  }

  return null;
}


/* =========================
   応答生成（ここが追加）
========================= */

function generateReply(userText){

  const recalled = recallFromText(userText);

  if(recalled){
    return `……そういえば、ラティスは「${recalled.value}」が好きでしたね。
……なるほど。もう少し聞かせてください。`;
  }

  return "……承知しました。続けてください、ラティス。";
}

</script>
