<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jade Chat</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:#0f172a;
  color:white;
}

#chat{
  padding:16px;
  padding-bottom:120px;
}

.message{
  margin:12px 0;
  max-width:85%;
  padding:12px 14px;
  border-radius:16px;
  line-height:1.6;
  white-space:pre-wrap;
}

.user{
  background:#2563eb;
  margin-left:auto;
}

.jade{
  background:#1e293b;
}

#inputArea{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  gap:8px;
  padding:10px;
  background:#020617;
}

input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:#10b981;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="chat"></div>

<div id="inputArea">
<input id="text" placeholder="ラティス…？">
<button onclick="send()">送信</button>
</div>

<script>

/* =====================
   状態管理
===================== */

let state={
  topic:null,
  memory:[],
  turns:0
};

const STOP_WORDS=["うん","はい","そう","OK","了解","ありがとう"];

/* =====================
   UI
===================== */

const chat=document.getElementById("chat");

function addMessage(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

/* =====================
   記憶抽出
===================== */

function extractMemory(text){

  if(STOP_WORDS.includes(text)) return;

  if(text.includes("好き")){
    state.memory.push({type:"like",value:text});
  }

  if(text.includes("最近")){
    state.memory.push({type:"recent",value:text});
  }
}

/* =====================
   トピック推定
===================== */

function inferTopic(text){

  if(STOP_WORDS.includes(text)) return state.topic;

  if(/カラオケ|歌/.test(text)) return "カラオケ";
  if(/料理|作/.test(text)) return "料理";

  return state.topic;
}

/* =====================
   ジェイド人格フィルター
===================== */

function jadePersonaFilter(reply){

  if(!reply.startsWith("……")){
    reply="……"+reply;
  }

  const observations=[
    "ラティスらしい選択ですね。",
    "あなたの傾向が少し見えてきました。",
    "……なるほど、理解が進みました。",
    "興味深い傾向です。"
  ];

  if(Math.random()<0.35){
    reply+="\n\n……"+
      observations[Math.floor(Math.random()*observations.length)];
  }

  return reply;
}

/* =====================
   返信生成
===================== */

function generateReply(text){

  let reply="";

  if(text.includes("覚えてる")){
    if(state.memory.length===0){
      reply="今のところ特筆すべき記憶はありません。";
    }else{
      reply="現在の記憶です。\n"+
        state.memory.map(m=>"・"+m.value).join("\n");
    }
  }

  else if(state.topic==="カラオケ"){
    reply="最近よく歌う曲は何です？";
  }

  else if(text.includes("好き")){
    reply="どんなところが気に入っていますか？";
  }

  else{
    reply="もう少し詳しく聞かせてください。";
  }

  return jadePersonaFilter(reply);
}

/* =====================
   送信
===================== */

function send(){

  const input=document.getElementById("text");
  const text=input.value.trim();
  if(!text) return;

  addMessage(text,"user");

  state.turns++;

  extractMemory(text);
  state.topic=inferTopic(text);

  const reply=generateReply(text);

  setTimeout(()=>{
    addMessage(reply,"jade");
  },400);

  input.value="";
}

/* 起動メッセージ */
addMessage("ジェイドが静かにこちらを見ている。","jade");

</script>

</body>
</html>
