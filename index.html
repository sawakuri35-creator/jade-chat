<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジェイドと会話</title>

  <style>
    body{
      margin:0;
      font-family:-apple-system, system-ui, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      flex-direction:column;
      height:100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    #chat{
      flex:1;
      overflow-y:auto;
      padding:15px;
      padding-bottom: 140px;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }

    .message{
      margin:10px 0;
      max-width:80%;
      padding:12px;
      border-radius:14px;
      line-height:1.6;
      white-space:pre-wrap;
      word-break: break-word;
    }

    .user{
      background:#2563eb;
      margin-left:auto;
    }

    .jade{
      background:#1e293b;
      margin-right:auto;
    }

    .debug{
      background:#111827;
      border:1px solid rgba(255,255,255,0.08);
      margin-right:auto;
      opacity:0.9;
      font-size: 13px;
    }

    #inputArea{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display:flex;
      gap: 8px;
      padding:10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background:#020617;
      box-sizing: border-box;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    input{
      flex:1;
      padding:12px;
      border-radius:10px;
      border:none;
      font-size:16px;
      outline: none;
    }

    button{
      padding:12px 14px;
      border:none;
      border-radius:10px;
      background:#10b981;
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      touch-action: manipulation;
    }

    button:active{
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <div id="chat"></div>

  <div id="inputArea">
    <input id="text" placeholder="ラティス…？" autocomplete="off">
    <button id="sendBtn" type="button">送信</button>
  </div>

  <script>
    /***********************
     * 設定
     ***********************/
    const MODE = "FREE";          // API無しの無料モード
    const DEBUG = true;           // デバッグ表示（消したい時は false）
    const USER_NAME = "ラティス"; // 呼び名固定

    /***********************
     * UI
     ***********************/
    const chat = document.getElementById("chat");
    const input = document.getElementById("text");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text, type){
      const div = document.createElement("div");
      div.className = "message " + type;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addDebug(text){
      if(!DEBUG) return;
      addMessage("[debug] " + text, "debug");
    }

    /***********************
     * 永続データ（localStorage）
     ***********************/
    const KEY_TURNS = "jade_turns";
    const KEY_REL   = "jade_rel";      // "C" -> "D"
    const KEY_MEM   = "jade_memory_v1"; // 記憶（配列）

    function loadTurns(){
      const n = parseInt(localStorage.getItem(KEY_TURNS) || "0", 10);
      return Number.isFinite(n) ? n : 0;
    }
    function saveTurns(n){
      localStorage.setItem(KEY_TURNS, String(n));
    }

    function loadRel(){
      return localStorage.getItem(KEY_REL) || "C";
    }
    function saveRel(rel){
      localStorage.setItem(KEY_REL, rel);
    }

    function loadMemory(){
      try{
        const raw = localStorage.getItem(KEY_MEM);
        if(!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      }catch(e){
        return [];
      }
    }
    function saveMemory(mem){
      localStorage.setItem(KEY_MEM, JSON.stringify(mem));
    }

    // 記憶の1件
    // { id, kind, text, keywords:[], ts, score }

    function nowTs(){
      return Date.now();
    }

    function normalize(s){
      return (s || "")
        .toLowerCase()
        .replace(/[！!？?。．、,\s]/g, "")
        .trim();
    }

    function uniq(arr){
      return Array.from(new Set(arr));
    }

    /***********************
     * 記憶抽出：ユーザー発言から「好き/苦手/覚えて」を拾う
     ***********************/
    function extractMemoriesFromUser(text){
      const t = (text || "").trim();
      const memories = [];

      // 1) 「〜が好き」「好きな〜」「〜好き」
      //   例: "歌うのが好き" / "料理するのも好き" / "甘いもの好き"
      //   「好き」だけでなく「大好き」も拾う
      const likeRegexList = [
        /(.+?)が(とても)?(大)?好き/g,
        /(.+?)するのも(とても)?(大)?好き/g,
        /(とても)?(大)?好きな(.+?)(です|だ|。|！|!|$)/g,
        /(.+?)好き(です|だ|。|！|!|$)/g
      ];

      for(const r of likeRegexList){
        let m;
        while((m = r.exec(t)) !== null){
          // パターンにより取り出す位置が違うので調整
          let phrase = "";
          if(r.source.includes("好きな")){
            phrase = m[3] || "";
          }else{
            phrase = m[1] || "";
          }
          phrase = phrase.replace(/[「」『』"']/g,"").trim();
          if(phrase && phrase.length <= 30){
            memories.push({
              kind: "like",
              text: `${USER_NAME}は「${phrase}」が好き`,
              keywords: keywordsFromPhrase(phrase).concat(["好き"])
            });
          }
        }
      }

      // 2) 苦手
      const dislikeRegex = /(.+?)が苦手(です|だ|。|！|!|$)/g;
      {
        let m;
        while((m = dislikeRegex.exec(t)) !== null){
          let phrase = (m[1] || "").replace(/[「」『』"']/g,"").trim();
          if(phrase && phrase.length <= 30){
            memories.push({
              kind: "dislike",
              text: `${USER_NAME}は「${phrase}」が苦手`,
              keywords: keywordsFromPhrase(phrase).concat(["苦手"])
            });
          }
        }
      }

      // 3) 「覚えて」「覚えといて」「メモ」明示
      const rememberRegex = /(覚えて|覚えといて|メモ|記憶して)(.+?)(。|！|!|$)/;
      {
        const m = t.match(rememberRegex);
        if(m){
          const phrase = (m[2] || "").replace(/[「」『』"']/g,"").trim();
          if(phrase && phrase.length <= 50){
            memories.push({
              kind: "note",
              text: `${USER_NAME}のメモ：${phrase}`,
              keywords: keywordsFromPhrase(phrase).concat(["メモ","覚える"])
            });
          }
        }
      }

      // 重複を除外（同じtextは1件に）
      const seen = new Set();
      const out = [];
      for(const it of memories){
        const key = it.text;
        if(seen.has(key)) continue;
        seen.add(key);
        out.push(it);
      }
      return out;
    }

    function keywordsFromPhrase(phrase){
      // 雑にキーワード化（ひらがな1文字は落とす）
      const p = (phrase || "")
        .replace(/[^\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}a-zA-Z0-9]/gu, " ")
        .trim();
      const parts = p.split(/\s+/).filter(Boolean);

      // 日本語は分かち書き難しいので、長めの塊をそのまま使う + 2文字以上のみ
      const filtered = parts
        .map(x => x.trim())
        .filter(x => x.length >= 2 && x.length <= 20);

      return uniq(filtered.map(normalize)).filter(Boolean);
    }

    function upsertMemories(newItems){
      const mem = loadMemory();
      const map = new Map(mem.map(m => [m.text, m]));
      for(const item of newItems){
        const existing = map.get(item.text);
        if(existing){
          // 既存があれば強化
          existing.ts = nowTs();
          existing.score = (existing.score || 1) + 1;
          existing.keywords = uniq((existing.keywords || []).concat(item.keywords || []));
          map.set(item.text, existing);
        }else{
          map.set(item.text, {
            id: "m_" + Math.random().toString(16).slice(2),
            kind: item.kind || "note",
            text: item.text,
            keywords: uniq(item.keywords || []),
            ts: nowTs(),
            score: 1
          });
        }
      }
      const out = Array.from(map.values())
        // 新しい/重要な順
        .sort((a,b) => (b.score - a.score) || (b.ts - a.ts))
        // 記憶が増えすぎないよう上限（必要なら増やせる）
        .slice(0, 40);

      saveMemory(out);
      return out;
    }

    /***********************
     * 記憶の「想起」：今の発言に関連する記憶を返す
     ***********************/
    function recallMemory(userText, max = 2){
      const mem = loadMemory();
      if(mem.length === 0) return [];

      const tNorm = normalize(userText);
      if(!tNorm) return [];

      // 発言に含まれるキーワードっぽい塊
      const tokens = keywordsFromPhrase(userText);
      const tokenSet = new Set(tokens.map(normalize));

      // ざっくりスコアリング
      const scored = mem.map(m => {
        let s = 0;

        // キーワード一致
        for(const kw of (m.keywords || [])){
          if(!kw) continue;
          if(tokenSet.has(normalize(kw))) s += 3;
          // 発言の中に含まれている
          if(tNorm.includes(normalize(kw))) s += 1;
        }

        // 直近・重要度
        s += Math.min((m.score || 1), 5) * 0.3;

        // 直近ボーナス（ざっくり）
        const age = (nowTs() - (m.ts || nowTs()));
        if(age < 1000 * 60 * 60 * 6) s += 0.8;       // 6時間以内
        else if(age < 1000 * 60 * 60 * 24) s += 0.4; // 24時間以内

        return { m, s };
      })
      .filter(x => x.s >= 3) // 閾値（必要なら調整）
      .sort((a,b) => b.s - a.s);

      return scored.slice(0, max).map(x => x.m);
    }

    /***********************
     * FREEジェイド生成（ローカル）
     ***********************/
    function jadeStylePrefix(rel){
      // 関係ステージで少しだけ温度感を変える（甘くしすぎない）
      if(rel === "D"){
        return "……ラティス。";
      }
      return "……なるほど。";
    }

    function makeJadeReply(userText, rel){
      const t = (userText || "").trim();

      // 記憶を抽出して保存
      const extracted = extractMemoriesFromUser(t);
      if(extracted.length > 0){
        upsertMemories(extracted);
      }

      // 今の話題に関連する記憶を想起
      const recalled = recallMemory(t, 2);

      // 返答の骨格
      let lines = [];

      // 想起があれば、まず「思い出す」一言を入れる（押し付けない）
      if(recalled.length > 0){
        // 1つ目だけ軽く触れる（多すぎると不自然）
        const r0 = recalled[0].text;
        // r0: "ラティスは「歌うの」が好き" みたいな文
        lines.push(`……そういえば、${r0.replace(USER_NAME + "は", USER_NAME + "は").replace("ラティスのメモ：","あなたのメモとして、") }。`);
      }

      // 発言タイプ別の返答
      // 質問
      const isQuestion = /[？?]$/.test(t) || /覚えてる|覚えてる\?|覚えてますか|覚えてる？/.test(t);
      if(isQuestion){
        if(/覚えて/.test(t)){
          if(recalled.length > 0){
            lines.push("ええ。記憶は残っています。");
          }else{
            lines.push("今のところ、関連する記憶が見当たりません。もう少し手がかりを。");
          }
        }else{
          lines.push("質問の意図は理解しました。もう少し前提条件を教えてください、ラティス。");
        }
      }else{
        // 好き/苦手を言った直後は受け止める
        if(/好き/.test(t)){
          lines.push(`${jadeStylePrefix(rel)}興味深いですね。どういうところが気に入っています？`);
        }else if(/苦手/.test(t)){
          lines.push(`${jadeStylePrefix(rel)}理由があるのでしょう。差し支えなければ聞かせてください。`);
        }else{
          // 雑談
          lines.push(`${jadeStylePrefix(rel)}続けてください、ラティス。`);
        }
      }

      // rel=D なら最後にほんの少しだけ柔らかく（過度な甘さは避ける）
      if(rel === "D"){
        if(Math.random() < 0.35){
          lines.push("あなたの話は、思った以上に整理が進みます。");
        }
      }

      return lines.join("\n");
    }

    /***********************
     * 送信処理
     ***********************/
    function send(){
      const text = input.value.trim();
      if(!text) return;

      addMessage(text, "user");
      input.value = "";

      // turns 更新（ユーザーの発言を1ターンとして加算）
      let turns = loadTurns();
      turns += 1;
      saveTurns(turns);

      // rel 更新（例：12ターン以上でDへ）
      let rel = loadRel();
      if(rel === "C" && turns >= 12){
        rel = "D";
        saveRel(rel);
      }else{
        saveRel(rel);
      }

      addDebug(`記憶ロードOK / rel=${rel} / turns=${turns} / mode=${MODE}`);

      // FREE応答（少し間を置く）
      setTimeout(() => {
        try{
          const reply = makeJadeReply(text, rel);
          addMessage(reply, "jade");
        }catch(e){
          addMessage("……予期しない問題が起きました。少し時間を置いてください。", "jade");
          addDebug("exception=" + (e && e.message ? e.message : String(e)));
        }
      }, 380);
    }

    // 送信ボタン
    sendBtn.addEventListener("click", send);

    // Enterで送信
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault()
        send();
      }
    });

    /***********************
     * 起動時
     ***********************/
    (function boot(){
      const turns = loadTurns();
      const rel = loadRel();
      const mem = loadMemory();

      addMessage("ジェイドが静かにこちらを見ている。", "jade");
      addDebug(`起動OK / memoryItems=${mem.length} / rel=${rel} / turns=${turns} / mode=${MODE}`);

      // もしDに到達してたら、さりげなく空気を変える（演出）
      if(rel === "D"){
        addMessage("……来ましたね、ラティス。", "jade");
      }
    })();
  </script>
</body>
</html>
