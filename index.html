<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジェイドと会話</title>

  <style>
    body{
      margin:0;
      font-family:-apple-system, system-ui, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      flex-direction:column;
      height:100vh;

      /* iPhoneのホームバーに被らない */
      padding-bottom: env(safe-area-inset-bottom);
    }

    #chat{
      flex:1;
      overflow-y:auto;
      padding:15px;
      padding-bottom: 140px; /* 入力欄に隠れないための余白 */
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }

    .message{
      margin:10px 0;
      max-width:80%;
      padding:12px;
      border-radius:14px;
      line-height:1.6;
      white-space:pre-wrap;
      word-break: break-word;
    }

    .user{
      background:#2563eb;
      margin-left:auto;
    }

    .jade{
      background:#1e293b;
      margin-right:auto;
    }

    #inputArea{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      display:flex;
      gap: 8px;
      padding:10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background:#020617;

      box-sizing: border-box;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    input{
      flex:1;
      padding:12px;
      border-radius:10px;
      border:none;
      font-size:16px;
      outline: none;
    }

    button{
      padding:12px 14px;
      border:none;
      border-radius:10px;
      background:#10b981;
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      touch-action: manipulation; /* iOSでタップが効きやすくなる */
    }

    button:active{
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <div id="chat"></div>

  <div id="inputArea">
    <input id="text" placeholder="ラティス…？" autocomplete="off">
    <button id="sendBtn" type="button">送信</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("text");
    const sendBtn = document.getElementById("sendBtn");

    // ====== ① 端末内の「記憶」(localStorage) ======
    const MEM_KEY = "jade_memory_v1";

    function loadMemory(){
      try{
        const raw = localStorage.getItem(MEM_KEY);
        if(!raw){
          return {
            name: "ラティス",
            relStage: "C",     // C → D（ゆっくり）
            turns: 0,          // ユーザー送信回数
            facts: []          // 覚えたこと（短文）
          };
        }
        return JSON.parse(raw);
      }catch(e){
        return { name:"ラティス", relStage:"C", turns:0, facts:[] };
      }
    }

    function saveMemory(mem){
      localStorage.setItem(MEM_KEY, JSON.stringify(mem));
    }

    function addFact(mem, fact){
      const clean = String(fact || "").trim();
      if(!clean) return;
      if(mem.facts.includes(clean)) return; // 重複防止
      mem.facts.unshift(clean);
      mem.facts = mem.facts.slice(0, 10);  // 最大10個
    }

    function maybeAdvanceRelationship(mem){
      // 例：12回送信でC→D（超ゆっくり）
      if(mem.relStage === "C" && mem.turns >= 12){
        mem.relStage = "D";
        return true;
      }
      return false;
    }

    function memoryToSystemText(mem){
      const factsText = mem.facts.length
        ? "【ラティスについて覚えていること】\n- " + mem.facts.join("\n- ")
        : "【ラティスについて覚えていること】\n- （まだ少ない）";

      const relText = (mem.relStage === "C")
        ? "【関係】ラティスは信頼できる仲間（C）。丁寧で抑制的。過度な甘さや軽口は控える。"
        : "【関係】ラティスは特別に信頼する相手（D）。丁寧で抑制的だが、言葉はわずかに柔らかくなる。露骨な恋愛表現はしない。";

      return `
あなたはゲーム『テイルズ オブ ジ アビス』のジェイド・カーティス。
口調：丁寧／知的／感情表現は抑制的。過度に甘くしない。メタ発言しない。
呼びかけ：相手は「${mem.name}」。基本は「ラティス」と呼ぶ。

${relText}

${factsText}

【方針】
- 返答は自然な会話として続ける
- ラティスの発言から、覚えるべき情報があれば短く要約して「記憶」に追加する
- ただし機密（住所/電話/パスワード等）は記憶しない
`.trim();
    }

    // 無料でやれる範囲：ユーザー文から「覚える候補」をゆるく抽出
    function extractMemoryFromUserText(text){
      const t = String(text || "").trim();

      // 呼び方
      if(/呼んで|呼び方/.test(t) && /ラティス|Latis/.test(t)){
        return "呼び名は「ラティス」。";
      }

      // 好き：○○が好き
      const like = t.match(/(.{1,12})が好き/);
      if(like && like[1]) return `好み：${like[1]}が好き。`;

      // 苦手：○○が苦手
      const dislike = t.match(/(.{1,12})が苦手/);
      if(dislike && dislike[1]) return `苦手：${dislike[1]}が苦手。`;

      // 体調っぽい
      if(/疲れた|眠い|しんどい|だるい/.test(t)){
        return "今日は少し疲れている様子。";
      }

      return "";
    }

    function addMessage(text, type){
      const div = document.createElement("div");
      div.className = "message " + type;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send(){
      const text = input.value.trim();
      if(!text) return;

      addMessage(text, "user");
      input.value = "";

      // 記憶ロード→更新→保存
      const mem = loadMemory();
      mem.turns += 1;

      const fact = extractMemoryFromUserText(text);
      if(fact) addFact(mem, fact);

      const advanced = maybeAdvanceRelationship(mem);
      saveMemory(mem);

      if(advanced){
        addMessage("（……ふむ。あなたへの信頼は、以前より確かなものになりましたね、ラティス。）", "jade");
      }

      // ---- ここからAIへ送る ----
      // あなたの Worker URL（いま動いてるもの）
      const WORKER_URL = "https://jade-proxy.sawakuri35.workers.dev";

      try{
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: [
              { role: "system", content: memoryToSystemText(mem) },
              { role: "user", content: text }
            ]
          })
        });

        const data = await res.json();

        const reply =
          data?.choices?.[0]?.message?.content ??
          data?.reply ??
          "……通信状態が不安定なようですね。";

        addMessage(reply, "jade");
      }catch(e){
        addMessage("……少し調子が悪いようです。後でもう一度試してください。", "jade");
      }
    }

    // 送信ボタン
    sendBtn.addEventListener("click", send);

    // Enterで送信（iPhoneでも使えることが多い）
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        send();
      }
    });

    // 起動時メッセージ＆動作確認のdebug
    (function boot(){
      addMessage("ジェイドが静かにこちらを見ている。", "jade");
      const mem = loadMemory();
      addMessage(`[debug] 記憶ロードOK / rel=${mem.relStage} / turns=${mem.turns}`, "jade");
    })();
  </script>
</body>
</html>
