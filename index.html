

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジェイドと会話</title>

  <style>
    body{
      margin:0;
      font-family:-apple-system, system-ui, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      flex-direction:column;
      height:100vh;

      /* iPhoneのホームバーに被らない */
      padding-bottom: env(safe-area-inset-bottom);
    }

    #chat{
      flex:1;
      overflow-y:auto;
      padding:15px;
      padding-bottom: 140px; /* 入力欄に隠れないための余白 */
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }

    .message{
      margin:10px 0;
      max-width:80%;
      padding:12px;
      border-radius:14px;
      line-height:1.6;
      white-space:pre-wrap;
      word-break: break-word;
    }

    .user{
      background:#2563eb;
      margin-left:auto;
    }

    .jade{
      background:#1e293b;
      margin-right:auto;
    }

    #inputArea{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      display:flex;
      gap: 8px;
      padding:10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background:#020617;

      box-sizing: border-box;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    input{
      flex:1;
      padding:12px;
      border-radius:10px;
      border:none;
      font-size:16px;
      outline: none;
    }

    button{
      padding:12px 14px;
      border:none;
      border-radius:10px;
      background:#10b981;
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      touch-action: manipulation; /* iOSでタップが効きやすくなる */
    }

    button:active{
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <div id="chat"></div>

  <div id="inputArea">
    <input id="text" placeholder="ラティス…？" autocomplete="off">
    <button id="sendBtn" type="button">送信</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("text");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text, type){
      const div = document.createElement("div");
      div.className = "message " + type;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function send(){
      const text = input.value.trim();
      if(!text) return;

      addMessage(text, "user");
      input.value = "";
      addMessage("【debug】この端末は新しいindex.htmlを読んでます", "jade");

fetch("https://jade-proxy.sawakuri35.workers.dev", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    messages: [
      {
        role: "system",
        content: "あなたはテイルズオブジアビスのジェイド・カーティス。丁寧で知的、感情は抑制的。ラティスを信頼する仲間として接する。"
      },
      {
        role: "user",
        content: text
      }
    ]
  })
})
.then(res => res.json())
.then(data => {
  const reply =
    data.choices?.[0]?.message?.content ??
    "……通信状態が不安定なようですね。";
  addMessage(reply, "jade");
})
.catch(() => {
  addMessage("……少し調子が悪いようです。後でもう一度試してください。", "jade");
});
    }

    // 送信ボタン
    sendBtn.addEventListener("click", send);

    // Enterで送信（iPhoneでも使えることが多い）
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        send();
      }
    });

    // 起動時メッセージ
    addMessage("ジェイドが静かにこちらを見ている。", "jade");
  </script>
</body>
</html>
