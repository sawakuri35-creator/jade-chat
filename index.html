<script>

/* ========= 意味リンク強化 ========= */

const SEMANTIC_LINKS = {
  "歌う": [
    "歌",
    "歌う",
    "カラオケ",
    "karaoke",
    "音楽",
    "曲",
    "歌った",
    "歌って",
    "歌い",
    "歌声"
  ],

  "料理": [
    "料理",
    "自炊",
    "レシピ",
    "作った",
    "作る",
    "ご飯",
    "キッチン"
  ]
};


/* ========= 想起ロジック（修正版） ========= */

function recallFromText(userText){

  const text = userText.toLowerCase();

  for(const item of state.memoryItems){

    if(item.type !== "like") continue;

    // ▼ 強化：意味リンク検索
    const links = SEMANTIC_LINKS[item.value] || [];

    for(const key of links){
      if(text.includes(key)){
        return item;
      }
    }

    // 本体一致
    if(text.includes(item.value)){
      return item;
    }
  }

  return null;
}

</script>
