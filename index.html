<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Jade Chat / 記憶システム優先</title>
  <style>
    :root{
      --bg1:#08101f; --bg2:#061224;
      --panel: rgba(255,255,255,.06);
      --panel2: rgba(255,255,255,.08);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --accent:#2f6bff;
      --accent2:#1f58e6;
      --border: rgba(255,255,255,.10);
      --shadow: 0 12px 40px rgba(0,0,0,.35);
      --radius: 18px;
      --radius2: 24px;
      --mono: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      --sans: -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(1100px 700px at 15% 0%, rgba(47,107,255,.20), transparent 60%),
        radial-gradient(900px 700px at 85% 25%, rgba(80,190,255,.14), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }
    .app{
      height:100%;
      display:flex;
      flex-direction:column;
      padding: 18px 16px 14px;
      gap: 12px;
      max-width: 880px;
      margin: 0 auto;
    }
    .top{
      display:flex;
      flex-direction:column;
      gap: 12px;
      padding-top: 2px;
    }
    .titleRow{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
    }
    .title{
      font-size: 22px;
      font-weight: 700;
      letter-spacing:.2px;
    }
    .subtitle{
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }
    .pillRow{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      align-items:center;
    }
    .pill{
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      font-size: 13px;
      color: rgba(255,255,255,.86);
      display:flex;
      align-items:center;
      gap: 8px;
      user-select:none;
    }
    .pill b{font-weight:700; color: rgba(255,255,255,.92)}
    .toggle{
      width: 44px; height: 26px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      border: 1px solid var(--border);
      position:relative;
      flex: 0 0 auto;
      cursor:pointer;
    }
    .toggle::after{
      content:"";
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      position:absolute;
      top: 2px; left: 2px;
      transition: transform .2s ease;
      box-shadow: 0 6px 14px rgba(0,0,0,.35);
    }
    .toggle.on{
      background: rgba(47,107,255,.28);
      border-color: rgba(47,107,255,.45);
    }
    .toggle.on::after{ transform: translateX(18px); }
    .btnClear{
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);
      color: rgba(255,255,255,.9);
      font-size: 14px;
      cursor:pointer;
      box-shadow: var(--shadow);
    }
    .btnClear:active{transform: translateY(1px)}
    .chat{
      flex:1;
      overflow:auto;
      padding: 6px 2px 10px;
      scroll-behavior:smooth;
    }
    .bubble{
      max-width: 92%;
      padding: 16px 16px;
      border-radius: var(--radius2);
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
      margin: 10px 0;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user{
      margin-left:auto;
      background: linear-gradient(180deg, rgba(47,107,255,.95), rgba(31,88,230,.92));
      border-color: rgba(255,255,255,.18);
      color: rgba(255,255,255,.95);
    }
    .bubble.sys{
      margin-right:auto;
      background: rgba(255,255,255,.06);
      border-style:dashed;
      color: rgba(255,255,255,.68);
      text-align:center;
      font-size: 13px;
    }
    .bubble.debug{
      margin-right:auto;
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,.80);
      background: rgba(255,255,255,.05);
      border-color: rgba(255,255,255,.10);
    }
    .composer{
      display:flex;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 18px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      align-items:center;
    }
    .input{
      flex:1;
      border:none;
      outline:none;
      background: transparent;
      color: rgba(255,255,255,.92);
      font-size: 16px;
      padding: 8px 10px;
    }
    .send{
      width: 92px;
      padding: 12px 0;
      border:none;
      border-radius: 14px;
      background: rgba(86, 210, 162, .92);
      color: rgba(0,0,0,.78);
      font-weight: 800;
      font-size: 16px;
      cursor:pointer;
      box-shadow: 0 14px 24px rgba(0,0,0,.25);
    }
    .send:active{transform: translateY(1px)}
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="titleRow">
        <div>
          <div class="title">Jade Chat / 記憶システム優先</div>
          <div class="subtitle">FREEモード（ローカル動作）</div>
        </div>
        <button class="btnClear" id="btnClear">記憶クリア</button>
      </div>

      <div class="pillRow">
        <div class="pill"><span>memory :</span><b id="pillMemory">0</b></div>
        <div class="pill"><span>rel :</span><b id="pillRel">C</b></div>
        <div class="pill"><span>mode :</span><b id="pillMode">FREE</b></div>
        <div class="pill"><span>turns :</span><b id="pillTurns">0</b></div>
        <div class="pill">
          <span>topic :</span><b id="pillTopic">—</b>
        </div>
        <div class="pill">
          <span>debug</span>
          <div class="toggle" id="debugToggle" title="debug表示"></div>
        </div>
      </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="composer">
      <input class="input" id="input" placeholder="ラティス…？" autocomplete="off" />
      <button class="send" id="send">送信</button>
    </div>
  </div>

<script>
/** =========================
 *  Jade Chat (FREE / Local)
 *  - 記憶(好き/事実) + topic(話題) + turns
 *  - 「好き」誤爆防止（質問文を記憶しない）
 *  - 返事が不自然になりにくい会話分岐
 * ========================= */

const STORAGE_KEY = "jade_chat_state_v2";
const USER_NAME = "ラティス";
const MODE = "FREE"; // 固定
const DEFAULT_REL = "C";

// ====== State ======
function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){
    return {
      rel: DEFAULT_REL,
      turns: 0,
      debug: false,
      topic: null,
      memory: {
        likes: [],  // ["歌う", "料理", ...]
        facts: []   // ["最近カラオケに行った", ...]
      }
    };
  }
  try{
    const st = JSON.parse(raw);
    // 最低限の補正
    st.rel ??= DEFAULT_REL;
    st.turns ??= 0;
    st.debug ??= false;
    st.topic ??= null;
    st.memory ??= {likes:[],facts:[]};
    st.memory.likes ??= [];
    st.memory.facts ??= [];
    return st;
  }catch(e){
    return {
      rel: DEFAULT_REL, turns:0, debug:false, topic:null,
      memory:{likes:[],facts:[]}
    };
  }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
let state = loadState();

// ====== UI ======
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const btnClear = document.getElementById("btnClear");
const pillMemory = document.getElementById("pillMemory");
const pillRel = document.getElementById("pillRel");
const pillMode = document.getElementById("pillMode");
const pillTurns = document.getElementById("pillTurns");
const pillTopic = document.getElementById("pillTopic");
const debugToggle = document.getElementById("debugToggle");

function updatePills(){
  const memCount = (state.memory.likes.length + state.memory.facts.length);
  pillMemory.textContent = memCount;
  pillRel.textContent = state.rel;
  pillMode.textContent = MODE;
  pillTurns.textContent = state.turns;
  pillTopic.textContent = state.topic ? state.topic : "—";
  debugToggle.classList.toggle("on", !!state.debug);
}
updatePills();

function scrollToBottom(){
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addBubble(text, who="jade"){
  const div = document.createElement("div");
  div.className = "bubble " + (who==="user" ? "user" : who==="sys" ? "sys" : who==="debug" ? "debug" : "");
  div.textContent = text;
  chatEl.appendChild(div);
  scrollToBottom();
}

function dbg(text){
  if(!state.debug) return;
  addBubble("[debug] " + text, "debug");
}

// 初回メッセージ（画面が空のときだけ）
if(chatEl.childElementCount === 0){
  addBubble("ジェイドが静かにこちらを見ている。", "jade");
  dbg(`起動OK / memoryItems=${state.memory.likes.length + state.memory.facts.length} / rel=${state.rel} / turns=${state.turns} / mode=${MODE}`);
}

// ====== Helpers ======
function normalize(s){
  return (s||"")
    .replace(/\s+/g," ")
    .replace(/[　]/g," ")
    .trim();
}

function uniqPush(arr, v){
  if(!v) return false;
  if(arr.includes(v)) return false;
  arr.push(v);
  return true;
}

/** --------
 * Topic推定（雑でも“破綻しない”が最優先）
 * -------- */
function inferTopicFromText(t){
  const s = t;
  if(/カラオケ/.test(s)) return "カラオケ";
  if(/歌|うた|歌う|歌唱/.test(s)) return "歌";
  if(/料理|作る|レシピ|作って|ごはん|献立/.test(s)) return "料理";
  if(/睡眠|寝|ねむ|夜泣き|起きる/.test(s)) return "睡眠";
  if(/仕事|勤務|職場|シフト/.test(s)) return "仕事";
  if(/テイルズ|アビス|ジェイド|カーティス/.test(s)) return "アビス";
  return null;
}
function updateTopic(t){
  const nt = inferTopicFromText(t);
  if(nt){
    // カラオケは歌のサブでもあるけど、表示はカラオケでOK
    state.topic = nt;
    saveState();
    updatePills();
    dbg(`topic更新=${state.topic}`);
  }
}

/** --------
 * 「好き」抽出（誤爆防止）
 * - 例: "歌うのが好き" -> "歌う"
 * - 例: "料理するのも好き" -> "料理"
 * - NG: "私の好きなこと覚えてる？"（質問なので保存しない）
 * -------- */
function extractLike(text){
  const s = text;

  // 質問っぽいものは除外（誤爆対策）
  if(/[？?]/.test(s)) return null;
  if(/覚えてる|覚えてる？|覚えてる\?|記憶/.test(s)) return null;

  // 代表パターン
  // 「Xが好き」「Xのが好き」「Xするのが好き」「Xも好き」
  let m = s.match(/(.+?)(?:するの)?(?:が|の)?好き(?:です|だ|！|!|。)?$/);
  if(m){
    let x = normalize(m[1]);
    // 余計な主語を削る
    x = x.replace(/^(私は|ぼくは|僕は|自分は|ラティスは)\s*/,"");
    x = x.replace(/^(こと|事)\s*/,"");
    // 「最近」などは好きではない
    if(/最近|昨日|今日|さっき/.test(x)) return null;
    // 末尾の助詞ゆる補正
    x = x.replace(/(する|やる)$/,"");
    x = normalize(x);
    if(x.length >= 1 && x.length <= 18) return x;
  }

  // 「X好き」単体（例: "歌好き"）
  m = s.match(/^(.+?)好き(?:！|!|。)?$/);
  if(m){
    let x = normalize(m[1]);
    x = x.replace(/^(私は|ぼくは|僕は|自分は|ラティスは)\s*/,"");
    if(x && x.length <= 18) return x;
  }

  return null;
}

/** --------
 * Fact抽出（軽い出来事）
 * -------- */
function extractFact(text){
  const s = text;
  if(/[？?]/.test(s)) return null;
  // 例: 最近カラオケ行った / 昨日〜した
  if(/最近.+(行った|した|やった|見た|食べた|作った)/.test(s)) return normalize(s);
  if(/昨日.+(行った|した|やった|見た|食べた|作った)/.test(s)) return normalize(s);
  return null;
}

/** --------
 * 記憶の要約（確認用）
 * -------- */
function memorySummary(){
  const likes = state.memory.likes.slice(0,8);
  const facts = state.memory.facts.slice(0,6);
  let out = "【記憶】\n";
  if(likes.length){
    out += "（好き）\n";
    likes.forEach(v=> out += "・" + v + "\n");
  }else{
    out += "（好き）\n・（なし）\n";
  }
  if(facts.length){
    out += "\n（最近の話）\n";
    facts.forEach(v=> out += "・" + v + "\n");
  }
  return out.trim();
}

// ====== Jade Reply Logic ======
function jadeSpeak(lines){
  return lines.join("\n");
}

function replyToUser(userText){
  const t = normalize(userText);
  if(!t) return;

  // turns
  state.turns += 1;

  // まずTopic更新（会話の流れの核）
  updateTopic(t);

  // 「好き」や「事実」を記憶に入れる（ただし誤爆させない）
  const like = extractLike(t);
  const fact = extractFact(t);

  let memoryAdded = false;
  if(like){
    memoryAdded = uniqPush(state.memory.likes, like) || memoryAdded;
    dbg(`like抽出=${like}`);
  }
  if(fact){
    memoryAdded = uniqPush(state.memory.facts, fact) || memoryAdded;
    dbg(`fact抽出=${fact}`);
  }

  saveState();
  updatePills();

  // ===== Intent =====
  const asksMemory =
    /覚えてる|覚えてる？|記憶|私の好き|好きなこと|覚えてますか/.test(t);

  // 会話：ユーザー発言を表示
  addBubble(t, "user");

  // debug: 記憶ロード
  dbg(`記憶ロードOK / rel=${state.rel} / turns=${state.turns} / mode=${MODE}`);

  // ===== Response build =====
  let res = [];

  // 1) 記憶確認
  if(asksMemory){
    res.push("……確認ですね。");
    res.push(memorySummary());
    res.push("");
    res.push("他にも、覚えておいてほしい「好き」や「最近の話」があれば、一文で教えてください。");
    addBubble(jadeSpeak(res), "jade");
    return;
  }

  // 2) 記憶追加の直後は、軽く反映してから自然な質問へ
  if(memoryAdded){
    // 反映文
    if(like){
      res.push(`……そういえば、${USER_NAME}は「${like}」が好き。`);
      res.push("記憶に追加しました。");
    }else if(fact){
      res.push("……承知しました。");
      res.push("今の話は記憶しておきます。");
    }else{
      res.push("……承知しました。");
    }

    // Topicに沿って深掘り
    res.push("");
    res.push(topicFollowUp(t));
    addBubble(jadeSpeak(res), "jade");
    return;
  }

  // 3) ここからは topic を使って“流れ”を作る
  res.push(topicResponse(t));
  addBubble(jadeSpeak(res), "jade");
}

function topicFollowUp(t){
  const topic = state.topic || "雑談";
  switch(topic){
    case "カラオケ":
    case "歌":
      return "……なるほど。どんな曲を歌うのが多いですか？";
    case "料理":
      return "……なるほど。得意料理、あるいは最近作って良かったものは？";
    case "睡眠":
      return "……状況を教えてください。いま困っている点は、入眠・夜間覚醒・早朝覚醒のどれです？";
    case "仕事":
      return "……職場の状況はどうです？ いま一番しんどい要因を一つだけ挙げるなら。";
    case "アビス":
      return "……話題としては悪くありません。どの場面の話をします？";
    default:
      return "……なるほど。もう少し詳しく聞かせてください、ラティス。";
  }
}

function topicResponse(t){
  const topic = state.topic || "雑談";

  // 短い入力（例: 最近カラオケ行った）を、topicで補完して返す
  if(topic === "カラオケ"){
    // カラオケと言ったのに「曲が好き？」が連発しないよう分岐
    if(/行った|行ってきた|行って/.test(t)){
      return jadeSpeak([
        "……カラオケですか。",
        "気分転換には良い選択ですね。",
        "何を歌いました？　あるいは、今日は「気持ちよく歌えた」曲はありましたか。"
      ]);
    }
    return jadeSpeak([
      "……カラオケの話ですね。",
      "どんな店で、どれくらい歌いました？"
    ]);
  }

  if(topic === "歌"){
    if(/カラオケ/.test(t)){
      state.topic = "カラオケ";
      saveState();
      updatePills();
      return topicResponse(t);
    }
    if(/好き/.test(t)){
      // 「歌うのが好き」などを保存済みのはず。ここでは深掘り。
      return jadeSpeak([
        "……なるほど。興味深いですね。",
        "歌うとき、いちばん気持ちが上がるのは「高音」「リズム」「歌詞」のどれです？"
      ]);
    }
    return jadeSpeak([
      "……話題は歌ですね。",
      "最近よく聴く曲か、歌ってみたい曲はありますか？"
    ]);
  }

  if(topic === "料理"){
    if(/作った|作る|レシピ|献立/.test(t)){
      return jadeSpeak([
        "……なるほど。家庭料理の試行錯誤は、案外“再現性”が大事です。",
        "今日作った（作りたい）のは何です？　材料だけでも。"
      ]);
    }
    return jadeSpeak([
      "……料理の話題ですね。",
      "味の好みは「甘め」「しょっぱめ」「さっぱり」だとどれ寄りです？"
    ]);
  }

  if(topic === "睡眠"){
    return jadeSpeak([
      "……睡眠の話題ですね。",
      "状況を短くで構いません。就寝〜起床の流れを、時刻つきで教えてください。"
    ]);
  }

  if(topic === "仕事"){
    return jadeSpeak([
      "……仕事の話題ですね。",
      "感情は後で整理します。まず事実として、何が起きています？"
    ]);
  }

  if(topic === "アビス"){
    return jadeSpeak([
      "……『アビス』の話ですね。",
      "どの時期のジェイドを想定します？　序盤／中盤／終盤。"
    ]);
  }

  // 雑談 fallback
  return jadeSpeak([
    "……承知しました。",
    "要点だけで構いません。いま話したいことは何でしょう、ラティス。"
  ]);
}

// ===== Events =====
sendBtn.addEventListener("click", () => {
  const t = inputEl.value;
  inputEl.value = "";
  replyToUser(t);
});

inputEl.addEventListener("keydown", (e) => {
  if(e.key === "Enter"){
    e.preventDefault();
    sendBtn.click();
  }
});

btnClear.addEventListener("click", () => {
  // 記憶だけをクリア（turns/topic/relは維持）
  state.memory.likes = [];
  state.memory.facts = [];
  state.topic = null;
  saveState();
  updatePills();
  addBubble("（記憶を消去した）", "sys");
  dbg("memory clear OK");
});

debugToggle.addEventListener("click", () => {
  state.debug = !state.debug;
  saveState();
  updatePills();
  dbg("debug ON");
});

// iOS: 画面表示直後に最下部へ
setTimeout(scrollToBottom, 80);
</script>
</body>
</html>
