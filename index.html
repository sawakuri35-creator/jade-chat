<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ジェイドと会話</title>

  <style>
    :root{
      --bg:#0b1224;
      --panel:#0f1a33;
      --panel2:#0b1730;
      --user:#2563eb;
      --jade:#1e293b;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent:#10b981;
      --border:rgba(255,255,255,0.10);
    }

    body{
      margin:0;
      font-family:-apple-system, system-ui, sans-serif;
      background:linear-gradient(180deg, #0a1020, #070b16);
      color:var(--text);
      height:100vh;
      display:flex;
      flex-direction:column;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Top bar */
    #topbar{
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(10,16,32,0.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
      padding:10px 12px;
    }
    #titleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }
    #appTitle{
      font-weight:700;
      letter-spacing:0.5px;
      font-size:16px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    #appTitle small{
      font-weight:600;
      color:var(--muted);
      font-size:12px;
    }

    #pills{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:1px solid var(--border);
      background:rgba(255,255,255,0.05);
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      color:var(--text);
      user-select:none;
    }
    .pill b{ font-weight:700; }
    .pill .muted{ color:var(--muted); }

    /* Debug toggle */
    #debugToggle{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--muted);
      font-size:12px;
      user-select:none;
    }
    #debugToggle input{
      width:18px;
      height:18px;
    }

    #chat{
      flex:1;
      overflow-y:auto;
      padding:14px 12px;
      padding-bottom: 170px;
      box-sizing:border-box;
      -webkit-overflow-scrolling: touch;
    }

    .message{
      margin:10px 0;
      max-width:86%;
      padding:12px 14px;
      border-radius:16px;
      line-height:1.7;
      white-space:pre-wrap;
      word-break: break-word;
      box-shadow: 0 6px 18px rgba(0,0,0,0.20);
    }

    .user{
      background:linear-gradient(180deg, #2a68ff, #1f4fd0);
      margin-left:auto;
    }

    .jade{
      background:rgba(30,41,59,0.92);
      margin-right:auto;
      border:1px solid rgba(255,255,255,0.06);
    }

    .debug{
      background:rgba(17,24,39,0.78);
      margin-right:auto;
      border:1px dashed rgba(255,255,255,0.18);
      color:#d1d5db;
      font-size:12px;
      box-shadow:none;
    }

    #inputArea{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display:flex;
      gap: 10px;
      padding:12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background:rgba(2,6,23,0.96);
      backdrop-filter: blur(10px);
      box-sizing: border-box;
      border-top: 1px solid var(--border);
    }

    input{
      flex:1;
      padding:14px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(255,255,255,0.06);
      color:var(--text);
      font-size:16px;
      outline: none;
    }
    input::placeholder{
      color:rgba(229,231,235,0.55);
    }

    button{
      padding:14px 16px;
      border:none;
      border-radius:14px;
      background:var(--accent);
      color:white;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      touch-action: manipulation;
      box-shadow: 0 10px 24px rgba(16,185,129,0.20);
    }
    button:active{ transform: scale(0.98); }

    /* Small action buttons (topbar) */
    #actions{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .miniBtn{
      padding:8px 10px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(255,255,255,0.06);
      color:var(--text);
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }
    .miniBtn:active{ transform:scale(0.98); }
  </style>
</head>

<body>
  <div id="topbar">
    <div id="titleRow">
      <div id="appTitle">
        Jade Chat <small>／ 記憶システム優先</small>
      </div>

      <div id="actions">
        <button class="miniBtn" id="btnClear">記憶クリア</button>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
      <div id="pills">
        <span class="pill"><b>memory</b>: <span id="memoryCount">0</span></span>
        <span class="pill"><b>rel</b>: <span id="relStage">C</span></span>
        <span class="pill"><b>mode</b>: <span id="modeLabel">FREE</span></span>
        <span class="pill"><span class="muted">turns</span>: <span id="turnsCount">0</span></span>
      </div>

      <label id="debugToggle" class="pill" title="デバッグ表示のON/OFF">
        <input type="checkbox" id="debugChk" />
        debug
      </label>
    </div>
  </div>

  <div id="chat"></div>

  <div id="inputArea">
    <input id="text" placeholder="ラティス…？" autocomplete="off" />
    <button id="sendBtn" type="button">送信</button>
  </div>

  <script>
    /***********************
     * Storage keys
     ***********************/
    const KEY_MEMORY = "jadechat_memory_v1";   // array of items
    const KEY_REL    = "jadechat_rel_v1";      // "C" etc
    const KEY_TURNS  = "jadechat_turns_v1";    // number
    const KEY_DEBUG  = "jadechat_debug_v1";    // "1"/"0"
    const MODE = "FREE"; // free mode (no API)

    /***********************
     * DOM
     ***********************/
    const chat = document.getElementById("chat");
    const input = document.getElementById("text");
    const sendBtn = document.getElementById("sendBtn");
    const memoryCountEl = document.getElementById("memoryCount");
    const relStageEl = document.getElementById("relStage");
    const modeLabelEl = document.getElementById("modeLabel");
    const turnsCountEl = document.getElementById("turnsCount");
    const debugChk = document.getElementById("debugChk");
    const btnClear = document.getElementById("btnClear");

    /***********************
     * Utilities
     ***********************/
    function nowISO(){ return new Date().toISOString(); }

    function loadJSON(key, fallback){
      try{
        const raw = localStorage.getItem(key);
        if(!raw) return fallback;
        return JSON.parse(raw);
      }catch(e){
        return fallback;
      }
    }
    function saveJSON(key, value){
      localStorage.setItem(key, JSON.stringify(value));
    }

    function loadStr(key, fallback){
      const v = localStorage.getItem(key);
      return (v === null || v === undefined) ? fallback : v;
    }

    function addMessage(text, type){
      const div = document.createElement("div");
      div.className = "message " + type;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function debugLog(text){
      if(!debugChk.checked) return;
      addMessage(text, "debug");
    }

    function setPills(){
      const mem = loadMemory();
      const rel = loadRel();
      const turns = loadTurns();

      memoryCountEl.textContent = String(mem.length);
      relStageEl.textContent = rel;
      modeLabelEl.textContent = MODE;
      turnsCountEl.textContent = String(turns);
    }

    /***********************
     * Memory
     ***********************/
    function loadMemory(){
      return loadJSON(KEY_MEMORY, []);
    }

    function saveMemory(items){
      saveJSON(KEY_MEMORY, items);
      setPills();
    }

    function loadRel(){
      const v = loadStr(KEY_REL, "C");
      return v || "C";
    }

    function saveRel(rel){
      localStorage.setItem(KEY_REL, rel);
      setPills();
    }

    function loadTurns(){
      const v = parseInt(loadStr(KEY_TURNS, "0"), 10);
      return Number.isFinite(v) ? v : 0;
    }

    function saveTurns(n){
      localStorage.setItem(KEY_TURNS, String(n));
      setPills();
    }

    function normalizeJP(s){
      if(!s) return "";
      return s
        .replace(/[「」『』【】\[\]\(\)（）]/g, "")
        .replace(/[。．\.！!？\?、,]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function dedupePushMemory(item){
      const mem = loadMemory();
      const key = item.kind + ":" + item.value;

      // already exists?
      const exists = mem.some(x => (x.kind + ":" + x.value) === key);
      if(exists) return { added:false, mem };

      mem.push(item);
      saveMemory(mem);
      return { added:true, mem };
    }

    // Extract "like" from user statement.
    // Examples:
    //  - "歌うのが好き"
    //  - "料理するのも好き"
    //  - "私は歌うのが好き"
    function extractLikeItem(userText){
      const t = normalizeJP(userText);

      // Exclude questions like "覚えてる？"
      if (/[?？]$/.test(userText.trim())) return null;
      if (t.includes("覚えてる")) return null;

      // Pattern: Xが好き / Xも好き / Xが好きだ / Xが好きです
      // We'll capture before "好き"
      const m = t.match(/^(.{1,30}?)(?:が|も|は)?好き(?:です|だ|)$/);
      if(m){
        let subject = m[1] || "";
        subject = subject.trim();

        // remove leading pronouns
        subject = subject.replace(/^(私|わたし|ラティス|僕|わたくし)\s*(は|が)?\s*/,"");
        subject = subject.trim();

        // common tail particles cleanup
        subject = subject.replace(/(する|やる|見る|聴く|聞く)$/,"$1"); // keep verbs
        subject = subject.replace(/(の|こと)$/,"の"); // unify a bit
        subject = subject.trim();

        if(subject.length >= 1){
          return normalizeJP(subject);
        }
      }
      return null;
    }

    // B: proactive recall
    function findRecallFromMemory(userText){
      const mem = loadMemory();
      if(mem.length === 0) return null;

      const t = normalizeJP(userText);
      if(!t) return null;

      // If user asks memory directly, don't do proactive recall (we'll handle separately)
      if (t.includes("覚えてる") || t.includes("覚えている") || t.includes("記憶")) return null;

      // Find best match (longer first)
      const likes = mem.filter(x => x.kind === "like");
      likes.sort((a,b) => (b.value.length - a.value.length));

      for(const item of likes){
        const v = normalizeJP(item.value);
        if(!v) continue;

        // direct substring match
        if(t.includes(v)){
          return item;
        }

        // weak match: if value is "歌うの" and text includes "歌"
        if(v.length >= 2){
          const core = v.replace(/の$/,"");
          if(core.length >= 1 && t.includes(core)){
            return item;
          }
        }
      }
      return null;
    }

    function buildMemoryListText(){
      const mem = loadMemory();
      const likes = mem.filter(x => x.kind === "like").map(x => x.value);

      if(likes.length === 0){
        return "……現時点では、特筆すべき記憶はまだありません。";
      }

      let out = "……確認ですね。\n\n【記憶（好き）】\n";
      for(const v of likes){
        out += "・" + v + "\n";
      }
      out += "\n他にも、覚えておいてほしい「好き」を一文で教えてください。";
      return out.trim();
    }

    /***********************
     * Jade persona (FREE)
     ***********************/
    function jadeReply(userText){
      const rel = loadRel();
      const t = normalizeJP(userText);

      // If user asks "覚えてる？" -> list memory
      if(t.includes("覚えてる") || t.includes("覚えている") || t.includes("記憶")){
        return buildMemoryListText();
      }

      // If user just told a like -> acknowledge and ask follow-up
      const likeItem = extractLikeItem(userText);
      if(likeItem){
        const r = dedupePushMemory({ kind:"like", value: likeItem, at: nowISO() });
        const base = `……そういえば、ラティスは「${likeItem}」が好き。`;
        const add = r.added ? "\n記憶に追加しました。" : "\n（これは既に覚えています。）";
        const q = "\n\n……なるほど。どういうところが気に入っています？";
        return (base + add + q).trim();
      }

      // Otherwise, normal conversation (restrained, polite)
      if(rel === "C"){
        return "……承知しました。\n要点だけで構いません。いま、話したいことは何でしょう、ラティス。";
      }
      // future: other rel stages
      return "……ええ。続けてください、ラティス。";
    }

    /***********************
     * Send flow
     ***********************/
    function send(){
      const text = input.value.trim();
      if(!text) return;

      addMessage(text, "user");
      input.value = "";

      // turns++
      const turns = loadTurns() + 1;
      saveTurns(turns);

      // Debug: memory load OK
      const mem = loadMemory();
      const rel = loadRel();
      debugLog(`[debug] 記憶ロードOK / rel=${rel} / turns=${turns} / mode=${MODE}`);

      // B: proactive recall (inserted BEFORE main reply)
      const recall = findRecallFromMemory(text);
      if(recall){
        // keep it subtle and restrained
        addMessage(`……そういえば、ラティスは「${recall.value}」が好きでしたね。`, "jade");
        debugLog(`[debug] proactive_recall=ON / hit=${recall.value}`);
      }else{
        debugLog(`[debug] proactive_recall=OFF / hit=null`);
      }

      // Main reply
      const reply = jadeReply(text);
      addMessage(reply, "jade");
    }

    /***********************
     * Init
     ***********************/
    function init(){
      // debug default
      const dbg = loadStr(KEY_DEBUG, "0");
      debugChk.checked = (dbg === "1");
      debugChk.addEventListener("change", () => {
        localStorage.setItem(KEY_DEBUG, debugChk.checked ? "1" : "0");
      });

      // ensure rel exists
      if(!localStorage.getItem(KEY_REL)) saveRel("C");
      // ensure turns exists
      if(!localStorage.getItem(KEY_TURNS)) saveTurns(0);

      setPills();

      addMessage("ジェイドが静かにこちらを見ている。", "jade");
      debugLog(`[debug] 起動OK / memoryItems=${loadMemory().length} / rel=${loadRel()} / turns=${loadTurns()} / mode=${MODE}`);
    }

    // Events
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        send();
      }
    });

    btnClear.addEventListener("click", () => {
      if(!confirm("記憶をすべて削除します。よろしいですか？")) return;
      saveMemory([]);
      saveTurns(0);
      saveRel("C");
      addMessage("……記憶は整理しました。必要なら、改めて教えてください。", "jade");
      debugLog(`[debug] memory_clear=OK`);
    });

    init();
  </script>
</body>
</html>
