<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ジェイドと会話</title>

  <style>
    body{
      margin:0;
      font-family:-apple-system, system-ui, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      flex-direction:column;
      height:100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    #chat{
      flex:1;
      overflow-y:auto;
      padding:15px;
      padding-bottom: 140px;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }

    .message{
      margin:10px 0;
      max-width:80%;
      padding:12px;
      border-radius:14px;
      line-height:1.6;
      white-space:pre-wrap;
      word-break: break-word;
    }

    .user{
      background:#2563eb;
      margin-left:auto;
    }

    .jade{
      background:#1e293b;
      margin-right:auto;
    }

    .debug{
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.92);
      margin-right:auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }

    #inputArea{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      display:flex;
      gap: 8px;
      padding:10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background:#020617;

      box-sizing: border-box;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    input{
      flex:1;
      padding:12px;
      border-radius:10px;
      border:none;
      font-size:16px;
      outline: none;
    }

    button{
      padding:12px 14px;
      border:none;
      border-radius:10px;
      background:#10b981;
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      touch-action: manipulation;
    }

    button:active{
      transform: scale(0.98);
    }

    #topBar{
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(8px);
      background: rgba(2,6,23,0.65);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 10px 12px;
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content: space-between;
    }

    #toggles{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.06);
      font-size: 12px;
      color: rgba(255,255,255,0.92);
    }

    .chip button{
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      background: rgba(16,185,129,0.9);
    }

    .chip button.danger{
      background: rgba(239,68,68,0.9);
    }

    .chip input[type="checkbox"]{
      transform: scale(1.1);
      accent-color: #10b981;
    }

    .small{
      opacity: 0.85;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="topBar">
    <div class="small">Jade Chat / 記憶システム優先</div>
    <div id="toggles">
      <label class="chip">
        <input id="debugToggle" type="checkbox" />
        debug
      </label>
      <span class="chip">
        memory: <span id="memoryCount">0</span>
      </span>
      <span class="chip">
        rel: <span id="relLabel">C</span>
      </span>
      <span class="chip">
        mode: <span id="modeLabel">FREE</span>
      </span>
      <span class="chip">
        <button id="clearMemoryBtn" class="danger" type="button">記憶を消す</button>
      </span>
    </div>
  </div>

  <div id="chat"></div>

  <div id="inputArea">
    <input id="text" placeholder="ラティス…？" autocomplete="off" />
    <button id="sendBtn" type="button">送信</button>
  </div>

  <script>
    /**********************
     * 設定
     **********************/
    const APP_VERSION = "mem-v2.0";
    const MODE = "FREE"; // 今は無料モード（AI APIは使わない）
    const REL_STAGE = "C"; // 関係値（今は表示だけ）

    // localStorage keys
    const LS_KEY_MEMORY = "jadeChat.memoryItems";
    const LS_KEY_TURNS = "jadeChat.turns";
    const LS_KEY_DEBUG = "jadeChat.debug";

    /**********************
     * DOM
     **********************/
    const chat = document.getElementById("chat");
    const input = document.getElementById("text");
    const sendBtn = document.getElementById("sendBtn");
    const debugToggle = document.getElementById("debugToggle");
    const clearMemoryBtn = document.getElementById("clearMemoryBtn");
    const memoryCountEl = document.getElementById("memoryCount");
    const relLabelEl = document.getElementById("relLabel");
    const modeLabelEl = document.getElementById("modeLabel");

    relLabelEl.textContent = REL_STAGE;
    modeLabelEl.textContent = MODE;

    /**********************
     * ユーティリティ
     **********************/
    function nowIso(){
      return new Date().toISOString();
    }

    function safeJsonParse(str, fallback){
      try { return JSON.parse(str); } catch(e) { return fallback; }
    }

    function loadTurns(){
      const n = Number(localStorage.getItem(LS_KEY_TURNS) || "0");
      return Number.isFinite(n) ? n : 0;
    }
    function saveTurns(n){
      localStorage.setItem(LS_KEY_TURNS, String(n));
    }

    function loadMemory(){
      const arr = safeJsonParse(localStorage.getItem(LS_KEY_MEMORY) || "[]", []);
      return Array.isArray(arr) ? arr : [];
    }
    function saveMemory(items){
      localStorage.setItem(LS_KEY_MEMORY, JSON.stringify(items));
      updateMemoryCount();
    }

    function updateMemoryCount(){
      const items = loadMemory();
      memoryCountEl.textContent = String(items.length);
    }

    function isDebug(){
      return debugToggle.checked;
    }

    function setDebug(v){
      debugToggle.checked = !!v;
      localStorage.setItem(LS_KEY_DEBUG, v ? "1" : "0");
    }

    function addMessage(text, type){
      const div = document.createElement("div");
      div.className = "message " + type;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addDebug(text){
      if(!isDebug()) return;
      addMessage(text, "debug");
    }

    /**********************
     * 記憶抽出（最重要）
     * - 「好き」を誤保存しない
     **********************/
    function normalizeJapaneseText(s){
      return (s || "")
        .replace(/\s+/g, " ")
        .replace(/　/g, " ")
        .trim();
    }

    // 質問・確認っぽいものは保存しない（末尾や語尾）
    function looksLikeQuestion(s){
      const t = normalizeJapaneseText(s);
      // ? / ？ / 「〜？」 / 「〜ですか」 / 「〜かな」 / 「覚えてる」など
      if (/[?？]\s*$/.test(t)) return true;
      if (/(ですか|ますか|かな|かしら|覚えてる|覚えてる？|覚えてるか|覚えてるの|知ってる|知ってる？)\s*$/.test(t)) return true;
      // 文中に「？」がある
      if (/[?？]/.test(t)) return true;
      return false;
    }

    // 断定の「好き」だけを抽出する
    // 例:
    //  - 「歌うのが好き」 → "歌うの"
    //  - 「料理好き」 → "料理"
    //  - 「私はジャズが好きです」 → "ジャズ"
    // NG:
    //  - 「好き？」 「好きなこと覚えてる？」 「好きなの？」 → 保存しない
    function extractLikeItem(userText){
      const t0 = normalizeJapaneseText(userText);

      // まず質問は弾く
      if (!t0) return null;
      if (looksLikeQuestion(t0)) return null;

      // 余計な主語などを軽く落とす（完全ではなく安全側）
      // 例: 「私は」「俺は」「ラティスは」など
      const t = t0
        .replace(/^(私は|俺は|ぼくは|僕は|ラティスは|ラティス、|ラティスは、)\s*/,"")
        .trim();

      // 「好きじゃない」「嫌い」など否定は今は保存しない（誤爆防止）
      if (/(好きじゃない|好きではない|嫌い|苦手)/.test(t)) return null;

      // パターン1: 「Xが好き」「Xが好きです」「Xが好きだ」
      // X は 1〜40文字くらい、ただし短すぎ/長すぎ除外
      let m = t.match(/^(.{1,40}?)が好き(です|だ|。\s*|！\s*|!\s*|$)/);
      if (m && m[1]) {
        const item = cleanupLikeTarget(m[1]);
        if (isGoodMemoryValue(item)) return item;
      }

      // パターン2: 「X好き」「X好きです」
      m = t.match(/^(.{1,40}?)好き(です|だ|。\s*|！\s*|!\s*|$)/);
      if (m && m[1]) {
        const item = cleanupLikeTarget(m[1]);
        if (isGoodMemoryValue(item)) return item;
      }

      // パターン3: 「好き：X」「好きはX」みたいな書き方
      m = t.match(/^好き[:：は]\s*(.{1,40})$/);
      if (m && m[1]) {
        const item = cleanupLikeTarget(m[1]);
        if (isGoodMemoryValue(item)) return item;
      }

      return null;
    }

    function cleanupLikeTarget(x){
      return normalizeJapaneseText(x)
        .replace(/[。！!？?]$/g,"")
        .replace(/^(こと|もの|の)\s*/,"")      // 「こと」「もの」「の」だけの曖昧を減らす
        .replace(/\s*(かな|かも|だと思う|と思ってる|です)\s*$/,"")
        .trim();
    }

    function isGoodMemoryValue(x){
      if (!x) return false;
      // あまりに短い/意味が薄いものは弾く
      if (x.length < 2) return false;
      // 「好き」そのもの、質問語系は弾く
      if (/^(好き|こと|もの|覚えてる|知ってる)$/.test(x)) return false;
      return true;
    }

    function upsertMemoryLike(value){
      const items = loadMemory();
      const exists = items.some(it => it && it.type==="like" && it.value===value);
      if (exists) return { added:false };

      const newItem = {
        id: cryptoRandomId(),
        type: "like",
        value,
        createdAt: nowIso()
      };
      items.push(newItem);
      saveMemory(items);
      return { added:true, item:newItem };
    }

    function cryptoRandomId(){
      // iOSでも動く軽量ID
      const arr = new Uint8Array(8);
      (crypto || window.msCrypto).getRandomValues(arr);
      return Array.from(arr).map(b => b.toString(16).padStart(2,"0")).join("");
    }

    function memorySummaryText(){
      const items = loadMemory().filter(it => it && it.type==="like");
      if (!items.length) return "（記憶なし）";
      // 最大5件だけ表示（増えすぎ防止）
      const top = items.slice(-5).map(it => `・${it.value}`).join("\n");
      const more = items.length > 5 ? `\n…ほか${items.length - 5}件` : "";
      return `【記憶（好き）】\n${top}${more}`;
    }

    /**********************
     * FREEモード返信（仮）
     * - 記憶が正しく動いているか確認できることを優先
     **********************/
    function freeModeReply(userText){
      const like = extractLikeItem(userText);
      if (like) {
        const r = upsertMemoryLike(like);
        if (r.added) {
          return [
            `……そういえば、ラティスは「${like}」が好き。`,
            "記憶に追加しました。",
            "",
            "……なるほど。どういうところが気に入っています？"
          ].join("\n");
        } else {
          return [
            `……ええ。「${like}」は、すでに記憶しています。`,
            "",
            "……最近はいつ頃それに触れました？"
          ].join("\n");
        }
      }

      // 「覚えてる？」の類は、記憶の中身を要約で返す（ここがBの肝）
      if (/覚えてる|覚えていますか|記憶/.test(userText)) {
        return [
          "……確認ですね。",
          memorySummaryText(),
          "",
          "他にも、覚えておいてほしい「好き」を一文で教えてください。",
          "（例：『紅茶が好き』）"
        ].join("\n");
      }

      // 通常時：記憶のガイドに寄せる
      return [
        "……了解しました。",
        "記憶を正確に積み上げたいので、あなたの情報は『断定の一文』で教えてください。",
        "（例：『歌うのが好き』『料理が好き』）",
        "",
        "今、何を記憶させたいですか？"
      ].join("\n");
    }

    /**********************
     * 送信処理
     **********************/
    function send(){
      const text = normalizeJapaneseText(input.value);
      if(!text) return;

      // turns++
      const turns = loadTurns() + 1;
      saveTurns(turns);

      addMessage(text, "user");
      input.value = "";

      // 記憶抽出ログ
      const extracted = extractLikeItem(text);
      if (extracted) {
        addDebug(`[debug] extractLikeItem = "${extracted}"`);
      } else {
        addDebug(`[debug] extractLikeItem = null`);
      }

      // 返信
      const reply = freeModeReply(text);
      addMessage(reply, "jade");

      // 状態ログ
      addDebug(`[debug] 記憶ロードOK / rel=${REL_STAGE} / turns=${turns} / mode=${MODE}`);
      updateMemoryCount();
    }

    /**********************
     * 起動
     **********************/
    // debug状態復元
    setDebug(localStorage.getItem(LS_KEY_DEBUG)==="1");

    // UIイベント
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        send();
      }
    });

    clearMemoryBtn.addEventListener("click", () => {
      const ok = confirm("記憶（ローカル保存）を全消去します。よろしいですか？");
      if(!ok) return;
      localStorage.removeItem(LS_KEY_MEMORY);
      updateMemoryCount();
      addDebug("[debug] memory cleared");
      addMessage("……記憶を消去しました。", "jade");
    });

    debugToggle.addEventListener("change", () => {
      setDebug(debugToggle.checked);
      addMessage(`……debug表示を ${debugToggle.checked ? "ON" : "OFF"} にしました。`, "jade");
    });

    updateMemoryCount();

    // 起動メッセージ
    addMessage("ジェイドが静かにこちらを見ている。", "jade");
    addDebug(`[debug] 起動OK / memoryItems=${loadMemory().length} / rel=${REL_STAGE} / turns=${loadTurns()} / mode=${MODE} / ver=${APP_VERSION}`);
  </script>
</body>
</html>
